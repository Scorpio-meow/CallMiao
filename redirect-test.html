<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>重定向測試</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-box { margin: 10px 0; padding: 10px; border: 1px solid #ddd; }
        button { padding: 8px 15px; margin: 5px; }
        .result { background: #f0f0f0; padding: 10px; margin: 10px 0; }
    </style>
</head>
<body>
    <h2>重定向測試工具</h2>
    
    <div class="test-box">
        <h3>1. 清除登入狀態</h3>
        <button onclick="clearSession()">清除 Session Storage</button>
        <div id="sessionResult" class="result"></div>
    </div>
    
    <div class="test-box">
        <h3>2. 測試重定向 URL</h3>
        <p>點擊下方連結測試不同的重定向情況：</p>
        <a href="/login/index.html?redirect=%2Fadmin%2Fagents.html" target="_blank">
            測試 1: /admin/agents.html (編碼後)
        </a><br><br>
        <a href="/login/index.html?redirect=/admin/agents.html" target="_blank">
            測試 2: /admin/agents.html (未編碼)
        </a><br><br>
        <button onclick="testRedirectFlow()">測試 3: 模擬管理介面重定向</button>
    </div>
    
    <div class="test-box">
        <h3>3. 當前環境資訊</h3>
        <div id="envInfo" class="result"></div>
        <button onclick="getServerConfig()">獲取伺服器配置</button>
    </div>

    <script>
        function clearSession() {
            sessionStorage.clear();
            document.getElementById('sessionResult').innerHTML = '✅ Session Storage 已清除';
        }
        
        function testRedirectFlow() {
            // 清除登入狀態
            sessionStorage.clear();
            // 重定向到管理介面（應該自動跳轉到登入頁面）
            window.open('/admin/agents.html', '_blank');
        }
        
        async function getServerConfig() {
            try {
                const response = await fetch('/api/config');
                const config = await response.json();
                document.getElementById('envInfo').innerHTML = `
                    <strong>伺服器配置：</strong><br>
                    Public Origin: ${config.publicOrigin}<br>
                    <strong>瀏覽器環境：</strong><br>
                    Current Origin: ${location.origin}<br>
                    Current URL: ${location.href}<br>
                    Host: ${location.host}<br>
                    Protocol: ${location.protocol}
                `;
            } catch (error) {
                document.getElementById('envInfo').innerHTML = `錯誤: ${error.message}`;
            }
        }
        
        // 頁面載入時顯示環境資訊
        window.addEventListener('load', () => {
            getServerConfig();
        });
    </script>
</body>
</html>
