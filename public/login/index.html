<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>數位叫號多媒體管理系統 - 登入</title>
  <link rel="stylesheet" href="/login/style.css"/>
</head>
<body>
  <div class="page">
    <div class="card">
      <div class="brand">
        <div class="logo" aria-label="LOGO">LOGO</div>
      </div>
      <h1 class="subtitle">數位叫號多媒體管理系統</h1>

      <form id="loginForm" class="form" autocomplete="off">
        <label>帳號</label>
        <input id="account" placeholder="輸入帳號" />

        <label>密碼</label>
        <input id="password" type="password" placeholder="••••••" />

        <label>驗證碼</label>
        <div class="captcha-row">
          <input id="captchaInput" placeholder="請輸入右側驗證碼" />
          <img id="captchaImage" class="captcha-img" alt="captcha" title="重新產生，請點擊圖片" />
        </div>
        <div class="hint">重新產生，請點擊圖片</div>

        <button type="submit" class="btn btn-dark">登入</button>
      </form>
    </div>
  </div>

  <script>
    const $ = (s)=>document.querySelector(s);
  let captchaToken = null;
  // read optional redirect from querystring; defaults to agent page
  const params = new URLSearchParams(location.search);
  const redirectTo = params.get('redirect') || '/agent/index.html';

    async function loadCaptcha(){
      try{
        const res = await fetch('/api/captcha/new');
        const data = await res.json();
        captchaToken = data.token;
        const img = document.querySelector('#captchaImage');
        img.src = `/api/captcha/image/${encodeURIComponent(captchaToken)}?t=${Date.now()}`;
      }catch(err){ console.error('captcha load', err); }
    }

    document.querySelector('#captchaImage').addEventListener('click', ()=> loadCaptcha());

    document.querySelector('#loginForm').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const acct = $('#account').value.trim();
      const pwd = $('#password').value.trim();
      const input = $('#captchaInput').value.trim();
      if(!acct){ alert('請輸入帳號'); return; }
      if(!pwd){ alert('請輸入密碼'); return; }
      if(!input){ alert('請輸入驗證碼'); return; }
      if(!captchaToken){ alert('驗證碼尚未就緒，請重新載入頁面'); return; }
      try{
        const res = await fetch('/api/login',{ method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ account: acct, password: pwd, captchaToken, captcha: input }) });
        const data = await res.json();
        if(!res.ok){ alert(data.error || '登入失敗'); await loadCaptcha(); return; }
        // success: store agent info returned by server (do NOT store passwords)
        try{
          if(data && data.agent){
            // prefer server-provided display name
            const display = data.agent.name || data.agent.account || acct;
            sessionStorage.setItem('agent_name', display);
            if(data.agent.counter) sessionStorage.setItem('agent_counter', data.agent.counter);
            if(data.agent.account) sessionStorage.setItem('agent_account', data.agent.account);
            if(data.agent.id) sessionStorage.setItem('agent_id', String(data.agent.id));
            if(data.agent.role) sessionStorage.setItem('agent_role', data.agent.role);
          } else {
            // fallback demo behavior: use submitted account as name
            if(acct) sessionStorage.setItem('agent_name', acct);
          }
        }catch(e){ console.warn('storage error', e); }
        // avoid open redirect by allowing only same-origin absolute paths
        try{
          console.log('Original redirectTo:', redirectTo);
          
          // Simple and robust path-based redirect
          if (redirectTo.startsWith('/')) {
            // Absolute path - construct full URL properly
            const baseUrl = location.origin;
            const fullUrl = baseUrl + redirectTo;
            console.log('Constructing URL from path:', redirectTo);
            console.log('Base URL:', baseUrl);
            console.log('Final URL:', fullUrl);
            location.href = fullUrl;
            return;
          }
          
          // Handle full URLs - be more permissive for DevTunnel environments
          if(redirectTo.startsWith('http://') || redirectTo.startsWith('https://')){
            try {
              const targetUrl = new URL(redirectTo);
              console.log('Full URL detected:', targetUrl.href);
              console.log('Current origin:', location.origin);
              console.log('Target origin:', targetUrl.origin);
              
              // Allow same origin or DevTunnel/localhost domains
              const currentHost = location.hostname;
              const targetHost = targetUrl.hostname;
              
              const isAllowed = (
                targetUrl.origin === location.origin ||
                (targetHost.includes('devtunnels.ms') && currentHost.includes('devtunnels.ms')) ||
                (targetHost === 'localhost' && currentHost === 'localhost') ||
                (targetHost === '127.0.0.1' && currentHost === '127.0.0.1')
              );
              
              if (isAllowed) {
                console.log('Origin validation passed, redirecting to:', targetUrl.href);
                location.href = targetUrl.href;
                return;
              } else {
                console.warn('Cross-origin redirect blocked:', redirectTo);
                console.warn('Current host:', currentHost, 'Target host:', targetHost);
                location.href = '/agent/index.html';
                return;
              }
            } catch (urlError) {
              console.error('URL parsing error:', urlError);
              location.href = '/agent/index.html';
              return;
            }
          }
          
          // Fallback: treat as relative path
          console.log('Treating as relative path:', redirectTo);
          location.href = redirectTo;
          
        }catch(e){ 
          console.error('Redirect error:', e);
          console.log('Fallback to agent page');
          location.href = '/agent/index.html'; 
        }
      }catch(err){ console.error(err); alert('登入錯誤'); }
    });

    loadCaptcha();
  </script>
</body>
</html>
