<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>數位叫號多媒體管理系統 - 登入</title>
  <link rel="stylesheet" href="/login/style.css" />
  <script src="/utils/url-manager.js"></script>
</head>

<body>
  <div class="page">
    <div class="card">
      <div class="brand">
        <div class="logo" aria-label="LOGO">LOGO</div>
      </div>
      <h1 class="subtitle">數位叫號多媒體管理系統</h1>
      <form id="loginForm" class="form" autocomplete="off">
        <label>帳號</label>
        <input id="account" placeholder="輸入帳號" />
        <label>密碼</label>
        <input id="password" type="password" placeholder="••••••" />
        <label>驗證碼</label>
        <div class="captcha-row">
          <input id="captchaInput" placeholder="請輸入右側驗證碼" />
          <img id="captchaImage" class="captcha-img" alt="captcha" title="重新產生，請點擊圖片" />
        </div>
        <div class="hint">重新產生，請點擊圖片</div>
        <button type="submit" class="btn btn-dark">登入</button>
      </form>
    </div>
  </div>
  <script src="/login/index.js"></script>
</body>

</html>
