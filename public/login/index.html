<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>登入 - 叫號喵</title>
  <link rel="stylesheet" href="/shared/base.css" />
  <link rel="stylesheet" href="/login/style.css" />
</head>

<body>
  <main class="auth">
    <div class="auth-heading">
      <h1>叫號喵</h1>
      <p class="muted">櫃員與管理員登入</p>
    </div>
    <form id="loginForm" class="card auth-card" novalidate>
      <div class="field">
        <label for="account">帳號</label>
        <input id="account" class="input" autocomplete="username" autocapitalize="off" spellcheck="false" />
      </div>
      <div class="field">
        <label for="password">密碼</label>
        <input id="password" class="input" type="password" autocomplete="current-password" />
      </div>
      <div class="field">
        <label for="captchaInput">驗證碼</label>
        <div class="captcha-row">
          <input id="captchaInput" class="input" autocomplete="off" autocapitalize="off" spellcheck="false" />
          <button id="captchaRefresh" class="captcha-btn" type="button" aria-label="換一張驗證碼">
            <img id="captchaImage" alt="驗證碼圖片" />
          </button>
        </div>
        <span class="field-help">看不清楚時，點圖片換一張</span>
      </div>
      <p id="loginError" class="alert alert-danger hidden" role="alert"></p>
      <button id="loginBtn" type="submit" class="btn btn-primary btn-block">登入</button>
    </form>
  </main>
  <script src="/login/index.js"></script>
</body>

</html>
