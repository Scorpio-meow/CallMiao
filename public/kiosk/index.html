<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>取號 - 叫號喵</title>
  <link rel="stylesheet" href="/shared/base.css" />
  <link rel="stylesheet" href="/kiosk/style.css" />
  <script src="/socket.io/socket.io.js"></script>
</head>

<body>
  <main class="kiosk">
    <header class="kiosk-header">
      <span class="brand">叫號喵</span>
      <h1>請選擇服務</h1>
      <p class="muted">輕觸服務項目取號，並留意叫號看板</p>
    </header>
    <section class="cards" id="cards" aria-label="服務項目"></section>
  </main>

  <dialog id="serviceModal" class="sheet" aria-labelledby="modalTitle" aria-describedby="modalDesc">
    <div class="sheet-body">
      <h2 id="modalTitle" class="sheet-title">取號</h2>
      <p id="modalDesc" class="muted"></p>
      <p id="modalError" class="alert alert-danger hidden" role="alert"></p>
    </div>
    <div class="sheet-actions">
      <button id="cancelModal" class="btn sheet-secondary" type="button">取消</button>
      <button id="confirmModal" class="btn btn-primary sheet-primary" type="button">確定取號</button>
    </div>
  </dialog>

  <dialog id="resultModal" class="sheet" aria-labelledby="resultTitle">
    <div class="sheet-body result">
      <h2 id="resultTitle" class="sheet-title">取號完成</h2>
      <p class="muted">您的號碼</p>
      <p id="number" class="ticket-number tabular"></p>
      <img id="qrcode" class="qrcode" alt="票券追蹤 QR Code" width="160" height="160" />
      <p class="muted">用手機掃描 QR Code，即可隨時查看叫號進度</p>
      <a id="ticketLink" class="ticket-link" target="_blank" rel="noopener"></a>
    </div>
    <div class="sheet-actions">
      <button id="closeResult" class="btn btn-primary sheet-primary" type="button">完成</button>
    </div>
  </dialog>

  <script src="/kiosk/index.js"></script>
</body>

</html>
