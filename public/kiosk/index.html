<!doctype html>
<html lang="zh-Hant">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>取號機 Kiosk</title>
    <link rel="stylesheet" href="/kiosk/style.css" />
    <script src="/socket.io/socket.io.js"></script>
</head>

<body>
    <div class="container">
        <header class="header">
            <div class="brand">
                <div class="logo" aria-label="LOGO">LOGO</div>
            </div>
            <div class="title">取號機</div>
        </header>

        <div class="notice">請輕觸螢幕按鍵取號，持號碼牌等候叫號，謝謝！</div>

        <main class="main-grid">
            <section class="service-area">
                <div class="cards">
                    <button class="card" data-service="A">
                        <h3>一般保險服務</h3>
                        <p>契約異動申請、解約、滿期給付…</p>
                        <span class="wait">等待人數：<b data-wait="A">0</b> 人</span>
                    </button>
                    <button class="card" data-service="B">
                        <h3>理賠送件服務</h3>
                        <p>理賠送件</p>
                        <span class="wait">等待人數：<b data-wait="B">0</b> 人</span>
                    </button>
                    <button class="card" data-service="C">
                        <h3>保單借款服務</h3>
                        <p>保險單借款</p>
                        <span class="wait">等待人數：<b data-wait="C">0</b> 人</span>
                    </button>
                    <button class="card" data-service="D">
                        <h3>繳費服務</h3>
                        <p>繳交保險費、還款</p>
                        <span class="wait">等待人數：<b data-wait="D">0</b> 人</span>
                    </button>
                    <button class="card" data-service="E">
                        <h3>人生設計所保險諮詢</h3>
                        <p>生涯規劃 / 商品諮詢（醫療、壽險等）</p>
                        <span class="wait">等待人數：<b data-wait="E">0</b> 人</span>
                    </button>
                </div>
            </section>
        </main>

        <input type="hidden" id="serviceType" value="A" />
    </div>

    <!-- Phone Modal -->
    <div id="phoneModal" class="modal hidden" role="dialog" aria-modal="true">
        <div class="modal-card">
            <h3 id="modalTitle">取號</h3>
            <label>電話號碼（必填）</label>
            <input id="phone" placeholder="0900-000-000" inputmode="numeric" required readonly />
            
            <!-- Digital Keypad -->
            <div class="digital-keypad">
                <button type="button" class="key-btn" data-digit="1">1</button>
                <button type="button" class="key-btn" data-digit="2">2</button>
                <button type="button" class="key-btn" data-digit="3">3</button>
                <button type="button" class="key-btn" data-digit="4">4</button>
                <button type="button" class="key-btn" data-digit="5">5</button>
                <button type="button" class="key-btn" data-digit="6">6</button>
                <button type="button" class="key-btn" data-digit="7">7</button>
                <button type="button" class="key-btn" data-digit="8">8</button>
                <button type="button" class="key-btn" data-digit="9">9</button>
                <button type="button" class="key-btn key-clear" id="clearPhone">清除</button>
                <button type="button" class="key-btn" data-digit="0">0</button>
                <button type="button" class="key-btn key-backspace" id="backspacePhone">⌫</button>
            </div>
            
            <div class="actions">
                <button id="cancelModal" class="btn">取消</button>
                <button id="confirmModal" class="btn btn-primary">確定取號</button>
            </div>
        </div>
    </div>

    <!-- Result Modal -->
    <div id="resultModal" class="modal hidden" role="dialog" aria-modal="true">
        <div class="modal-card">
            <section id="result" class="result">
                <h2>已取號</h2>
                <p>您的號碼：<strong id="number"></strong></p>
                <img id="qrcode" alt="QR code" />
                <p>票券連結：<a id="ticketLink" target="_blank"></a></p>
                <p class="note">請攜帶此 QR 至櫃台出示；亦可隨時回到此連結查看進度。</p>
                <div class="actions">
                    <button id="closeResult" class="btn btn-primary">關閉</button>
                </div>
            </section>
        </div>
    </div>

    <script>
        const $ = (s) => document.querySelector(s);
        const socket = io();
        const SERVICE_NAMES = { A: '一般保險服務', B: '理賠送件服務', C: '保單借款服務', D: '繳費服務', E: '人生設計所保險諮詢' };

        function onlyDigits(s) { return (s || '').replace(/\D/g, ''); }
        function setActiveService(code) { document.querySelector('#serviceType').value = code; }

        async function loadOverview() {
            const res = await fetch('/api/overview');
            const data = await res.json();
            const sum = (data.summary || []).reduce((acc, s) => { acc[s.serviceType] = s; return acc; }, {});
            // update card waits
            ['A', 'B', 'C', 'D', 'E'].forEach(code => {
                const el = document.querySelector(`[data-wait="${code}"]`);
                if (el) el.textContent = sum[code]?.waiting || 0;
            });
            // summary chips with full names (guard if #summary not present)
            const html = (data.summary || []).map(s =>
                `<div class="chip">${SERVICE_NAMES[s.serviceType] || s.serviceType} 等候 ${s.waiting || 0}</div>`
            ).join('');
            const summaryEl = document.querySelector('#summary');
            if (summaryEl) summaryEl.innerHTML = html;
        }

        // Service cards click -> open modal
        let selectedService = 'A';
        document.querySelectorAll('.card[data-service]').forEach(c => {
            c.onclick = () => {
                selectedService = c.getAttribute('data-service');
                setActiveService(selectedService);
                $('#modalTitle').textContent = `取號：${SERVICE_NAMES[selectedService] || selectedService}`;
                $('#phone').value = ''; // Clear phone input when opening modal
                $('#phoneModal').classList.remove('hidden');
            };
        });

        $('#cancelModal').onclick = () => $('#phoneModal').classList.add('hidden');
        
        // Digital keypad functionality
        function updatePhoneDisplay() {
            const phoneInput = $('#phone');
            const currentValue = phoneInput.value;
            // Format phone number with dashes for display
            const formatted = currentValue.replace(/(\d{4})(\d{3})(\d{3})/, '$1-$2-$3');
            phoneInput.value = formatted;
        }
        
        // Handle digit input
        document.querySelectorAll('.key-btn[data-digit]').forEach(btn => {
            btn.onclick = () => {
                const digit = btn.getAttribute('data-digit');
                const phoneInput = $('#phone');
                const currentDigits = onlyDigits(phoneInput.value);
                if (currentDigits.length < 15) { // Limit to 15 digits
                    phoneInput.value = currentDigits + digit;
                    updatePhoneDisplay();
                    // Visual feedback for touch
                    btn.style.transform = 'scale(0.95)';
                    setTimeout(() => { btn.style.transform = ''; }, 150);
                }
            };
            
            // Touch event handlers for better mobile experience
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                btn.style.transform = 'scale(0.95)';
                btn.style.background = '#2563eb';
                btn.style.color = '#fff';
            });
            
            btn.addEventListener('touchend', (e) => {
                e.preventDefault();
                setTimeout(() => {
                    btn.style.transform = '';
                    btn.style.background = '';
                    btn.style.color = '';
                }, 150);
                btn.click();
            });
        });
        
        // Handle clear button
        $('#clearPhone').onclick = () => {
            $('#phone').value = '';
            // Visual feedback
            const btn = $('#clearPhone');
            btn.style.transform = 'scale(0.95)';
            setTimeout(() => { btn.style.transform = ''; }, 150);
        };
        
        // Handle backspace button
        $('#backspacePhone').onclick = () => {
            const phoneInput = $('#phone');
            const currentDigits = onlyDigits(phoneInput.value);
            if (currentDigits.length > 0) {
                phoneInput.value = currentDigits.slice(0, -1);
                updatePhoneDisplay();
            }
            // Visual feedback
            const btn = $('#backspacePhone');
            btn.style.transform = 'scale(0.95)';
            setTimeout(() => { btn.style.transform = ''; }, 150);
        };
        
        // Add touch events for clear and backspace buttons
        ['#clearPhone', '#backspacePhone'].forEach(selector => {
            const btn = document.querySelector(selector);
            if (btn) {
                btn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    btn.style.transform = 'scale(0.95)';
                });
                
                btn.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    setTimeout(() => { btn.style.transform = ''; }, 150);
                    btn.click();
                });
            }
        });

        // Remove the old input event handler and replace with keypad-only input
        // $('#phone').addEventListener('input', (e) => { e.target.value = onlyDigits(e.target.value).slice(0, 15); });

        // Confirm create ticket
        $('#confirmModal').onclick = async () => {
            const serviceType = $('#serviceType').value;
            const rawPhone = $('#phone').value;
            const phone = onlyDigits(rawPhone) || undefined;
            // basic client-side validation: require phone digits and reasonable length
            if (!phone || phone.length < 6) { alert('請輸入有效的電話號碼（至少 6 位數）'); return; }
            const res = await fetch('/api/tickets', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ serviceType, phone }) });
            const { ticket, error } = await res.json();
            if (error) { alert(error); return; }
            if (ticket) {
                // try to get public origin from server (useful when server is behind a proxy or tunnel)
                let publicOrigin = null;
                try {
                    const cfgRes = await fetch('/api/config');
                    if (cfgRes.ok) {
                        const cfg = await cfgRes.json();
                        publicOrigin = cfg.publicOrigin || null;
                    }
                } catch (e) { /* ignore */ }
                const base = publicOrigin || location.origin;
                const ticketUrl = `${base}/ticket/index.html?id=${ticket.id}`;
                $('#number').textContent = ticket.number;
                $('#ticketLink').textContent = ticketUrl;
                $('#ticketLink').href = ticketUrl;
                $('#qrcode').src = `/api/qrcode?text=${encodeURIComponent(ticketUrl)}`;
                // 開啟結果彈窗
                $('#phoneModal').classList.add('hidden');
                $('#resultModal').classList.remove('hidden');
                loadOverview();
            }
        };

        // 關閉結果彈窗
        document.addEventListener('click', (e) => {
            if (e.target && e.target.id === 'closeResult') {
                $('#resultModal').classList.add('hidden');
            }
        });

        loadOverview();
        socket.on('queue:update', loadOverview);
    </script>
</body>

</html>
