<!doctype html>
<html lang="zh-Hant">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>櫃員端</title>
    <link rel="stylesheet" href="/agent/style.css" />
    <script src="/socket.io/socket.io.js"></script>
    <script src="/utils/url-manager.js"></script>
    <script src="/utils/auth-checker.js"></script>
</head>

<body>
    <div class="container agent-red">
        <div class="agent-header">
            <div class="left">
                <h1 class="title">櫃員設定</h1>
                <div class="agent-meta">
                    <span>服務人員：</span><strong id="agentNameDisplay">—</strong>
                </div>
            </div>
            <div class="right">
                <div class="auth compact">
                    <button class="btn btn-light" id="logoutBtn" title="登出">登出</button>
                    <span id="authStatus" class="muted"></span>
                </div>
            </div>
        </div>
        <div class="top-info">
            <div class="info-grid">
                <div class="info-field">
                    <label>目前叫號</label>
                    <input id="currentCallField" readonly placeholder="—" />
                </div>
                <div class="info-field">
                    <label>等候時間</label>
                    <input id="waitTimeField" readonly placeholder="—" />
                </div>
                <div class="info-field">
                    <label>服務時間</label>
                    <input id="serviceTimeField" readonly placeholder="—" />
                </div>
                <div class="info-field smallctrl">
                    <label>櫃台號（由管理員設定）</label>
                    <div class="counter-group">
                        <input id="counter" placeholder="1" readonly />
                    </div>
                </div>
            </div>
            <div class="stat">
                <div class="label">總等待人數</div>
                <div class="value" id="totalWaitCount">0</div>
            </div>
        </div>
        <table class="w-100">
            <td class="w-49">
                <div class="footer-info">
                    <div class="clock" id="clock">—</div>
                    <h3 class="section-title">客戶等候名單</h3>
                    <div id="categoryList" class="category-list"></div>
                </div>
            </td>
            <td class="w-49">
                <div class="ops-grid">
                    <button class="btn btn-primary op" id="callNext" title="N">叫號</button>
                    <button class="btn btn-secondary op" id="markServing" title="S">開始服務</button>
                    <button class="btn btn-primary op outline" id="recall" title="R">重叫號</button>
                    <button class="btn btn-success op" id="finish" title="F">結束服務</button>
                    <button class="btn btn-danger op" id="cancel" title="X">取消叫號</button>
                    <button class="btn btn-light op" id="transfer">轉櫃/轉服務</button>
                    <button class="btn btn-light op" id="createTicket">櫃檯取號</button>
                    <button class="btn btn-light op" id="pickup">未取號補取</button>
                    <button class="btn btn-light op" id="internalCall">內部叫號</button>
                    <button class="btn btn-light op" id="pause">暫停服務</button>
                    <button class="btn btn-light op" id="callSpecific">指定叫號</button>
                    <button class="btn btn-light op" id="history">歷史叫號查詢</button>
                    <button class="btn btn-light op" id="message">密傳訊息</button>
                </div>
                <div class="verify-line">
                    <input id="ticketId" placeholder="ticket number" />
                    <button id="pickFromInput" class="btn btn-light">選取</button>
                    <input type="hidden" id="ticketInternalId" />
                    <input type="hidden" id="serviceType" value="A" />
                </div>
                <div id="selectedInfo" class="service-compact muted mt-8"></div>
            </td>
        </table>
        <div class="legacy-panels hidden">
            <div class="grid">
                <div class="panel">
                    <h3>目前等待</h3>
                    <table class="table">
                        <thead>
                            <tr>
                                <th>號碼</th>
                                <th>時間</th>
                            </tr>
                        </thead>
                        <tbody id="waiting"></tbody>
                    </table>
                </div>
                <div class="panel">
                    <h3>目前叫號 / 服務中</h3>
                    <table class="table">
                        <thead>
                            <tr>
                                <th>號碼</th>
                                <th>櫃台</th>
                                <th>叫號時間</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="current"></tbody>
                    </table>
                    <div id="selectedInfoLegacy" class="selected-info muted"></div>
                </div>
            </div>
        </div>
    </div>
    <div id="toaster" class="toaster"></div>
    <div id="historyModal" class="auth-overlay hidden">
        <div class="auth-card w-640 maxh-70vh overflow-auto">
            <h2>歷史叫號</h2>
            <div id="historyBody" class="muted">載入中…</div>
            <div class="actions mt-12 flex-end gap-8">
                <button id="historyClose" class="btn btn-light">關閉</button>
            </div>
        </div>
    </div>
    <div id="authOverlay" class="auth-overlay hidden">
        <div class="auth-card">
            <h2>櫃員登入</h2>
            <label>姓名</label>
            <input id="loginName" placeholder="輸入姓名" />
            <label>櫃台（必填）</label>
            <input id="loginCounter" placeholder="櫃台編號" />
            <div class="actions mt-12 flex-end gap-8">
                <button id="loginBtn" class="btn btn-primary">登入</button>
            </div>
        </div>
    </div>
    <script src="/agent/index.js"></script>
</body>

</html>
