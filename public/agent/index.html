<!doctype html>
<html lang="zh-Hant">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>櫃員端</title>
    <link rel="stylesheet" href="/agent/style.css" />
    <script src="/socket.io/socket.io.js"></script>
</head>

<body>
    <div class="container agent-red">

        <!-- Header / Tabs -->
        <div class="agent-header">
            <div class="left">
                <h1 class="title">櫃員設定</h1>
                <div class="agent-meta">
                    <span>服務人員：</span><strong id="agentNameDisplay">—</strong>
                </div>
            </div>
            <div class="right">
                <!--div class="tabbar">
                    <button id="openSecondScreen" class="tab active">第二螢幕</button>
                    <button class="tab" disabled>滿意度評鑑</button>
                    <button class="tab" disabled>重新評鑑</button>
                </div-->
                <!-- auth controls (PIN removed) -->
                <div class="auth compact">
                    <button class="btn btn-light" id="logoutBtn" title="登出">登出</button>
                    <span id="authStatus" class="muted"></span>
                </div>
            </div>
        </div>

        <!-- Info + Stats + Service/Counter small controls -->
        <div class="top-info">
            <div class="info-grid">
                <div class="info-field">
                    <label>目前叫號</label>
                    <input id="currentCallField" readonly placeholder="—" />
                </div>
                <div class="info-field">
                    <label>等候時間</label>
                    <input id="waitTimeField" readonly placeholder="—" />
                </div>
                <div class="info-field">
                    <label>服務時間</label>
                    <input id="serviceTimeField" readonly placeholder="—" />
                </div>
                <div class="info-field smallctrl">
                    <label>櫃台號（由管理員設定）</label>
                    <div class="counter-group">
                        <input id="counter" placeholder="1" readonly />
                    </div>
                </div>
            </div>

            <div class="stat">
                <div class="label">總等待人數</div>
                <div class="value" id="totalWaitCount">0</div>
            </div>
        </div>

        <table class="w-100">
            <td class="w-49">
                <!-- Footer clock and category list -->
                <div class="footer-info">
                    <div class="clock" id="clock">—</div>
                    <h3 class="section-title">客戶等候名單</h3>
                    <div id="categoryList" class="category-list"></div>
                </div>
            </td>
            <td class="w-49">
                <!-- Operations matrix -->
                <div class="ops-grid">
                    <button class="btn btn-primary op" id="callNext" title="N">叫號</button>
                    <button class="btn btn-secondary op" id="markServing" title="S">開始服務</button>
                    <button class="btn btn-primary op outline" id="recall" title="R">重叫號</button>
                    <button class="btn btn-success op" id="finish" title="F">結束服務</button>
                    <button class="btn btn-danger op" id="cancel" title="X">取消叫號</button>

                    <button class="btn btn-light op" id="transfer">轉櫃/轉服務</button>
                    <button class="btn btn-light op" id="createTicket">櫃檯取號</button>
                    <button class="btn btn-light op" id="pickup">未取號補取</button>
                    <button class="btn btn-light op" id="internalCall">內部叫號</button>

                    <button class="btn btn-light op" id="pause">暫停服務</button>
                    <button class="btn btn-light op" id="callSpecific">指定叫號</button>
                    <button class="btn btn-light op" id="history">歷史叫號查詢</button>
                    <button class="btn btn-light op" id="message">密傳訊息</button>
                </div>

                <div class="verify-line">
                    <input id="ticketId" placeholder="ticket number" />
                    <button id="pickFromInput" class="btn btn-light">選取</button>
                    <input type="hidden" id="ticketInternalId" />
                    <input type="hidden" id="serviceType" value="A" />
                </div>
                <div id="selectedInfo" class="service-compact muted mt-8"></div>
                <!-- service buttons will be rendered inside #categoryList by renderCategoryList -->
            </td>
        </table>


        <!-- Hidden original tables (kept for JS compatibility) -->
        <div class="legacy-panels hidden">
            <div class="grid">
                <div class="panel">
                    <h3>目前等待</h3>
                    <table class="table">
                        <thead>
                            <tr>
                                <th>號碼</th>
                                <th>時間</th>
                                <th>電話</th>
                            </tr>
                        </thead>
                        <tbody id="waiting"></tbody>
                    </table>
                </div>

                <div class="panel">
                    <h3>目前叫號 / 服務中</h3>
                    <table class="table">
                        <thead>
                            <tr>
                                <th>號碼</th>
                                <th>櫃台</th>
                                <th>叫號時間</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="current"></tbody>
                    </table>
                    <div id="selectedInfoLegacy" class="selected-info muted"></div>
                </div>
            </div>
        </div>



    </div>

    <div id="toaster" class="toaster"></div>

    <!-- History modal -->
    <div id="historyModal" class="auth-overlay hidden">
    <div class="auth-card w-640 maxh-70vh overflow-auto">
            <h2>歷史叫號</h2>
            <div id="historyBody" class="muted">載入中…</div>
            <div class="actions mt-12 flex-end gap-8">
                <button id="historyClose" class="btn btn-light">關閉</button>
            </div>
        </div>
    </div>

    <!-- Local overlay fallback login (kept for backward-compat) -->
    <div id="authOverlay" class="auth-overlay hidden">
        <div class="auth-card">
            <h2>櫃員登入</h2>
            <label>姓名</label>
            <input id="loginName" placeholder="輸入姓名" />
            <label>櫃台（必填）</label>
            <input id="loginCounter" placeholder="櫃台編號" />
            <div class="actions mt-12 flex-end gap-8">
                <button id="loginBtn" class="btn btn-primary">登入</button>
            </div>
        </div>
    </div>

    <!-- Phone input modal for create/pickup -->
    <div id="phoneInputModal" class="auth-overlay hidden">
        <div class="auth-card">
            <h2>輸入電話（必填）</h2>
            <label>電話</label>
            <input id="modalPhone" placeholder="0912345678" required />
            <div class="actions mt-12 flex-end gap-8">
                <button id="modalCancel" class="btn btn-light">取消</button>
                <button id="modalOk" class="btn btn-primary">確定</button>
            </div>
        </div>
    </div>

    <script>
        const $ = (s) => document.querySelector(s);
    const socket = io();
        // 狀態中文對照
        const STATUS_LABEL = {
            waiting: '等候',
            called: '已叫號',
            serving: '服務中',
            finished: '已完成',
            canceled: '已取消',
            cancelled: '已取消'
        };
        function statusLabel(s) { return STATUS_LABEL[s] || (s || '-'); }
        let agentName = sessionStorage.getItem('agent_name') || '';
        let savedCounter = sessionStorage.getItem('agent_counter') || '';

        function updateAgentNameUI() { $('#agentNameDisplay').textContent = agentName || '—'; }

        function initializeCounterDisplay() {
            const savedCounter = sessionStorage.getItem('agent_counter') || '';
            const counterEl = document.querySelector('#counter');
            if (counterEl) {
                counterEl.value = savedCounter || '';
                if (!savedCounter) {
                    counterEl.placeholder = '未設定（請聯絡管理員）';
                }
            }
        }

        if (savedCounter) { const c = document.querySelector('#counter'); if (c && !c.value) c.value = savedCounter; }
        if (agentName) document.querySelector('#authStatus').textContent = '已登入';
        updateAgentNameUI();
        initializeCounterDisplay();

        // overlay login
        function showOverlay() { document.querySelector('#authOverlay').classList.remove('hidden'); }
        function hideOverlay() { document.querySelector('#authOverlay').classList.add('hidden'); }
        // If there's no stored agent info, redirect to the centralized login page and request return to this page.
        if (!agentName) {
            const redirect = encodeURIComponent('/agent/index.html');
            window.location.href = `/login/index.html?redirect=${redirect}`;
        }
        document.querySelector('#loginBtn').onclick = () => {
            const nm = document.querySelector('#loginName').value.trim();
            const ctr = document.querySelector('#loginCounter').value.trim();
            if (!nm) { alert('請輸入姓名'); return; }
            if (!ctr) { alert('請輸入櫃台號'); return; }
            agentName = nm; savedCounter = ctr;
            if (agentName) sessionStorage.setItem('agent_name', agentName);
            if (savedCounter) sessionStorage.setItem('agent_counter', savedCounter);
            // Update the counter display
            initializeCounterDisplay();
            document.querySelector('#authStatus').textContent = '已登入';
            updateAgentNameUI();
            hideOverlay();
            refresh();
        };
        document.querySelector('#logoutBtn').onclick = () => {
            sessionStorage.removeItem('agent_name');
            sessionStorage.removeItem('agent_counter');
            document.querySelector('#authStatus').textContent = '';
            updateAgentNameUI();
            // Clear counter display
            const counterEl = document.querySelector('#counter');
            if (counterEl) {
                counterEl.value = '';
                counterEl.placeholder = '未設定（請聯絡管理員）';
            }
            // After logout, send user back to the login page handled by /public/login
            window.location.href = '/login/index.html';
        };

        function maskPhone(p) { if (!p) return ''; return String(p).replace(/(\d{3})\d{4}(\d{3,4})/, '$1****$2'); }

        function toast(msg, type = 'info') {
            const el = document.createElement('div');
            el.className = `toast ${type}`;
            el.textContent = msg;
            document.querySelector('#toaster').appendChild(el);
            setTimeout(() => { el.classList.add('show'); }, 10);
            setTimeout(() => { el.classList.remove('show'); el.remove(); }, 3000);
        }

        // apiFetch wrapper: attach x-agent-pin for protected endpoints and x-agent-name for display only
        // memory-only PIN for this tab; cleared on refresh/close
        let ADMIN_PIN_MEM = null;
        window.addEventListener('beforeunload', () => { ADMIN_PIN_MEM = null; });
        async function apiFetch(url, opts = {}) {
            opts = Object.assign({ headers: {} }, opts);
            const name = sessionStorage.getItem('agent_name');
            if (ADMIN_PIN_MEM) { opts.headers['x-agent-pin'] = ADMIN_PIN_MEM; }
            // retain name header only for server-side logging (not for auth)
            if (name) { try { opts.headers['x-agent-name'] = encodeURIComponent(name); } catch (e) { opts.headers['x-agent-name'] = name; } }
            let res = await fetch(url, opts);
            if (res.status === 401) {
                // prompt once per action; do not persist
                const newPin = prompt('請輸入管理 PIN 以使用櫃員功能');
                ADMIN_PIN_MEM = newPin || null;
                opts.headers['x-agent-pin'] = ADMIN_PIN_MEM || '';
                res = await fetch(url, opts);
            }
            return res;
        }

        function setSelectedInfo(ticket) {
            const el = document.querySelector('#selectedInfo');
            if (!el) return;
            if (!ticket) { el.textContent = ''; return; }
            const phoneMasked = maskPhone(ticket.phone);
            el.innerHTML = `選取：<strong>${ticket.number}</strong>，櫃台 ${ticket.counter || '-'}，電話 ${phoneMasked || '-'}`;
        }

        function updateClock() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            const ss = String(now.getSeconds()).padStart(2, '0');
            const str = `${y}/${m}/${d} ${hh}:${mm}:${ss}`;
            const clk = document.querySelector('#clock'); if (clk) clk.textContent = str;
        }
        setInterval(updateClock, 1000); updateClock();

        function renderCategoryList(summary) {
            // Keep the label mapping consistent with the service buttons in the UI
            const SERVICE_NAMES = {
                A: '一般保險服務',
                B: '理賠送件服務',
                C: '保單借據服務',
                D: '繳費服務',
                E: '人生設計所保險諮詢'
            };
            // Standard order A..E
            const order = ['A', 'B', 'C', 'D', 'E'];
            const map = (summary || []).reduce((acc, s) => { acc[s.serviceType] = s.waiting || 0; return acc; }, {});
            // Render only the category rows (no service buttons or quick counters)
            const categoriesHtml = `${order.map(code => {
                const count = map[code] || 0;
                return `<div class="category-row" data-service="${code}"><div class="count">${count}</div><div class="label">${SERVICE_NAMES[code] || code}</div></div>`;
            }).join('')}`;
            const wrap = document.querySelector('#categoryList');
            if (wrap) {
                wrap.innerHTML = categoriesHtml;
                // click to select serviceType, update visual active state, and refresh
                const rows = wrap.querySelectorAll('.category-row');
                rows.forEach(el => {
                    el.onclick = () => {
                        const svc = el.getAttribute('data-service');
                        const svcInput = document.querySelector('#serviceType');
                        if (svcInput) svcInput.value = svc;
                        // visual active
                        rows.forEach(r => r.classList.remove('active'));
                        el.classList.add('active');
                        refresh();
                    };
                });

                // initialize active row from #serviceType
                const svc0 = document.querySelector('#serviceType')?.value;
                if (svc0) {
                    rows.forEach(r => r.classList.remove('active'));
                    const initial = wrap.querySelector(`.category-row[data-service="${svc0}"]`);
                    if (initial) initial.classList.add('active');
                }
            }
        }

        // pick button next to ticketId input: find matching ticket by visible number or internal id
        const pickBtn = document.querySelector('#pickFromInput');
        if (pickBtn) {
            pickBtn.addEventListener('click', (e) => {
                e.preventDefault();
                const vis = document.querySelector('#ticketId');
                const hid = document.querySelector('#ticketInternalId');
                const num = vis ? (vis.value || '').trim() : '';
                if (!num) { alert('請先輸入或選取號碼'); return; }
                // try to find a row in current list by data-number
                const rowByNumber = document.querySelector(`[data-number="${CSS.escape(num)}"]`);
                if (rowByNumber) {
                    const id = rowByNumber.getAttribute('data-id') || '';
                    if (hid) hid.value = id;
                    if (vis) vis.value = num;
                    // construct selected info from currentCalls if present
                    const svc = rowByNumber.querySelector('.badge') ? rowByNumber.querySelector('.badge').textContent : '';
                    setSelectedInfo({ number: num, counter: rowByNumber.querySelector('td:nth-child(2)') ? rowByNumber.querySelector('td:nth-child(2)').textContent.trim() : '-', phone: '' , serviceType: svc, id: id });
                    return;
                }
                // fallback: if num looks numeric, try match by internal id
                const possibleRowById = document.querySelector(`[data-id="${CSS.escape(num)}"]`);
                if (possibleRowById) {
                    const number = possibleRowById.getAttribute('data-number') || '';
                    if (hid) hid.value = possibleRowById.getAttribute('data-id') || '';
                    if (vis) vis.value = number;
                    setSelectedInfo({ number: number, counter: possibleRowById.querySelector('td:nth-child(2)') ? possibleRowById.querySelector('td:nth-child(2)').textContent.trim() : '-', phone: '', id: possibleRowById.getAttribute('data-id') });
                    return;
                }
                alert('找不到對應的叫號');
            });
        }

        async function refresh() {
            const res = await apiFetch('/api/overview');
            const data = await res.json();
            const serviceType = document.querySelector('#serviceType').value;

            // update waiting table (legacy)
            const waitingRes = await apiFetch(`/api/tickets/waiting?serviceType=${serviceType}`);
            const waitingData = await waitingRes.json();
            const waitingTbody = document.querySelector('#waiting');
            if (waitingTbody) {
                waitingTbody.innerHTML = waitingData.tickets.map(t =>
                    // 補上 data-id 以沿用既有的 [data-id] 點擊事件處理
                    `<tr class="clickable" data-waiting-id="${t.id}" data-id="${t.id}" data-number="${t.number}">
                        <td>${t.number}</td>
                        <td>${new Date(t.createdAt).toLocaleTimeString()}</td>
                        <td>${maskPhone(t.phone)}</td>
                    </tr>`
                ).join('') || '<tr><td colspan="3">無</td></tr>';
            }

            const currentTbody = document.querySelector('#current');
            if (currentTbody) {
                currentTbody.innerHTML = (data.currentCalls || []).map(c =>
                    `<tr class="clickable" data-id="${c.id}" data-number="${c.number}">
                        <td><span class="badge">${c.serviceType}</span> ${c.number}</td>
                        <td>${c.counter || '-'}</td>
                        <td>${new Date(c.calledAt).toLocaleTimeString()}</td>
                        <td><button class="btn btn-light" data-pick="${c.id}">選取</button></td>
                    </tr>`
                ).join('') || '<tr><td colspan="4">無</td></tr>';
            }

            document.querySelectorAll('[data-id]').forEach(tr => {
                tr.onclick = () => {
                    const id = tr.getAttribute('data-id');
                    const num = tr.getAttribute('data-number') || '';
                    const vis = document.querySelector('#ticketId'); if (vis) vis.value = num || '';
                    const hid = document.querySelector('#ticketInternalId'); if (hid) hid.value = id || '';
                };
            });
            document.querySelectorAll('button[data-pick]').forEach(btn => {
                btn.onclick = (e) => {
                    e.stopPropagation();
                    const id = btn.getAttribute('data-pick');
                    const row = document.querySelector(`[data-id="${id}"]`);
                    const num = row ? (row.getAttribute('data-number') || '') : '';
                    const vis = document.querySelector('#ticketId'); if (vis) vis.value = num || '';
                    const hid = document.querySelector('#ticketInternalId'); if (hid) hid.value = id || '';
                };
            });

            // selection: prefer hidden internal id (numeric). If missing, fallback to visible ticket number match.
            const hidVal = document.querySelector('#ticketInternalId')?.value;
            const selId = hidVal ? Number(hidVal) : null;
            const visNum = document.querySelector('#ticketId')?.value;
            let cur = null;
            if (selId) {
                cur = (data.currentCalls || []).find(x => x.id === selId);
            }
            if (!cur && visNum) {
                cur = (data.currentCalls || []).find(x => String(x.number) === String(visNum));
            }
            setSelectedInfo(cur || null);

            // Stats: local (selected service waiting), total (sum waiting)
            const summary = data.summary || [];
            const sumMap = summary.reduce((acc, s) => { acc[s.serviceType] = s.waiting || 0; return acc; }, {});
            const local = sumMap[serviceType] || 0;
            const total = summary.reduce((n, s) => n + (s.waiting || 0), 0);
            const lw = document.querySelector('#localWaitCount'); if (lw) lw.textContent = local;
            const tw = document.querySelector('#totalWaitCount'); if (tw) tw.textContent = total;

            // Info fields
            const firstWaiting = waitingData.tickets?.[0];
            const waitField = document.querySelector('#waitTimeField');
            if (waitField) {
                if (firstWaiting) {
                    const mins = Math.max(0, Math.floor((Date.now() - new Date(firstWaiting.createdAt).getTime()) / 60000));
                    waitField.value = `${mins} 分鐘`;
                } else { waitField.value = '—'; }
            }
            const currentCallField = document.querySelector('#currentCallField');
            const ticketIdEl = document.querySelector('#ticketId');
            const ticketInternalEl = document.querySelector('#ticketInternalId');
            if (currentCallField) { currentCallField.value = cur ? cur.number : '—'; }
            // keep visible ticketId in sync with current call's number, and store internal id in hidden field
            if (cur) {
                if (ticketIdEl) ticketIdEl.value = cur.number || '';
                if (ticketInternalEl) ticketInternalEl.value = (cur.id !== undefined && cur.id !== null) ? String(cur.id) : '';
            } else {
                if (ticketIdEl) ticketIdEl.value = '';
                if (ticketInternalEl) ticketInternalEl.value = '';
            }
            const serviceTimeField = document.querySelector('#serviceTimeField');
            if (serviceTimeField) {
                if (cur && cur.calledAt) {
                    const mins = Math.max(0, Math.floor((Date.now() - new Date(cur.calledAt).getTime()) / 60000));
                    serviceTimeField.value = `${mins} 分鐘`;
                } else { serviceTimeField.value = '—'; }
            }

            renderCategoryList(summary);
        }

        // Existing handlers (mostly unchanged)
        $('#callNext').onclick = async () => {
            const serviceType = $('#serviceType').value;
            const counter = ($('#counter').value || '').trim();
            if (!counter) { alert('櫃台號未設定，請聯絡管理員設定您的櫃台號'); return; }
            const res = await apiFetch('/api/agent/callNext', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ serviceType, counter })
            });
            const data = await res.json();
            if (data.error) {
                toast(data.error, 'error');
            } else {
                toast(`已叫號 ${data.ticket.number}`, 'success');
                const vis = document.querySelector('#ticketId');
                const hid = document.querySelector('#ticketInternalId');
                if (vis) vis.value = data.ticket.number || '';
                if (hid) hid.value = data.ticket.id || '';
                try { setSelectedInfo({ number: data.ticket.number, counter: data.ticket.counter, phone: data.ticket.phone, id: data.ticket.id, serviceType: data.ticket.serviceType }); } catch (e) { /* noop */ }
            }
            await refresh();
        };

        socket.on('queue:update', refresh);
        socket.on('call:made', refresh);
        // Join rooms for targeted messaging once connected
        socket.on('connect', () => {
            try {
                const ctr = sessionStorage.getItem('agent_counter') || '';
                if (ctr) socket.emit('join', `counter:${ctr}`);
                if (agentName) socket.emit('join', `agent:${agentName}`);
            } catch (e) { /* noop */ }
        });

        // 接收密傳訊息廣播：其他櫃員或系統訊息
        socket.on('agent:message', (payload) => {
            try {
                const { text, from, toCounter, toAgent } = payload || {};
                if (!text) return;
                // 若為自己剛發送的訊息，避免重複顯示（已顯示「已送出訊息」）
                if (from && agentName && String(from) === String(agentName)) return;
                // If message has a target and doesn't match this client, ignore
                const myCounter = sessionStorage.getItem('agent_counter') || '';
                if (toCounter && String(toCounter) !== String(myCounter)) return;
                if (toAgent && agentName && String(toAgent) !== String(agentName)) return;
                // Otherwise show
                toast(`【訊息】${from || '系統'}：${text}`, 'info');
            } catch (e) { /* noop */ }
        });
        refresh();

        $('#markServing').onclick = async () => {
            const id = $('#ticketInternalId').value;
            if (!id) { alert('請選取一筆叫號'); return; }
            // fetch ticket to get full phone (not masked)
            // use protected endpoint to retrieve phone for verification
            const ticketRes = await apiFetch(`/api/agent/ticket/${Number(id)}`);
            if (!ticketRes.ok) {
                const j = await ticketRes.json().catch(() => ({ error: '查詢失敗' }));
                alert(j && j.error ? j.error : '取得票券失敗');
                return;
            }
            const ticketJson = await ticketRes.json();
            const ticket = ticketJson.ticket;
            const phoneDigits = ticket && ticket.phone ? String(ticket.phone).replace(/\D/g, '') : '';
            if (!phoneDigits) {
                alert('此票券未紀錄電話，無法透過電話後四碼驗證開始服務');
                return;
            }
            const last4 = phoneDigits.slice(-4);
            const v = prompt('請輸入客戶電話後四碼以開始服務');
            if (v === null) return; // user cancelled
            if (String(v).trim() !== String(last4)) { alert('電話後四碼驗證失敗'); return; }
            // verified, proceed to mark serving
            const res = await apiFetch('/api/agent/markServing', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ticketId: Number(id) })
            });
            const data = await res.json();
            if (data.error) { toast(data.error, 'error'); } else { toast(`已開始服務 ${data.ticket.number}`, 'success'); }
            await refresh();
        };

        $('#finish').onclick = async () => {
            const id = $('#ticketInternalId').value;
            if (!id) { alert('請選取一筆叫號'); return; }
            const result = prompt('處理結果（備註，可留空）') || undefined;
            const res = await apiFetch('/api/agent/finish', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ticketId: Number(id), result })
            });
            const data = await res.json();
            if (data.error) { toast(data.error, 'error'); } else { toast(`已完成 ${data.ticket.number}`, 'success'); document.querySelector('#ticketId').value = ''; document.querySelector('#ticketInternalId').value = ''; setSelectedInfo(null); }
            await refresh();
        };

        $('#cancel').onclick = async () => {
            const id = $('#ticketInternalId').value;
            if (!id) { alert('請選取一筆叫號'); return; }
            const reason = prompt('取消原因（備註，可留空）') || undefined;
            if (!confirm(`確定要取消此叫號嗎？`)) return;
            const res = await apiFetch('/api/agent/cancel', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ticketId: Number(id), reason })
            });
            const data = await res.json();
            if (data.error) { 
                toast(data.error, 'error'); 
            } else { 
                toast(`已取消 ${data.ticket.number}`, 'success'); 
                document.querySelector('#ticketId').value = ''; 
                document.querySelector('#ticketInternalId').value = ''; 
                setSelectedInfo(null); 
            }
            await refresh();
        };

        $('#recall').onclick = async () => {
            const id = $('#ticketInternalId').value; if (!id) { alert('請選取一筆叫號'); return; }
            const res = await apiFetch('/api/agent/recall', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ticketId: Number(id) })
            });
            const data = await res.json();
            if (data.error) {
                toast(data.error, 'error');
            } else {
                toast(`重叫 ${data.ticket.number}`, 'success');
                const vis = document.querySelector('#ticketId');
                const hid = document.querySelector('#ticketInternalId');
                if (vis) vis.value = data.ticket.number || '';
                if (hid) hid.value = data.ticket.id || '';
                try { setSelectedInfo({ number: data.ticket.number, counter: data.ticket.counter, phone: data.ticket.phone, id: data.ticket.id, serviceType: data.ticket.serviceType }); } catch (e) { /* noop */ }
            }
            await refresh();
        };

        $('#transfer').onclick = async () => {
            const id = $('#ticketInternalId').value; if (!id) { alert('請選取一筆叫號'); return; }
            const toServiceType = prompt('轉至服務類型（A/B/C/D/E，不填維持）') || undefined;
            const toCounter = prompt('指定櫃台（可留空）') || undefined;
            const keepStatus = confirm('保持狀態與叫號時間？按 確定 保持 / 取消 重置為等待');
            const res = await apiFetch('/api/agent/transfer', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ticketId: Number(id), toServiceType, toCounter, keepStatus })
            });
            const data = await res.json();
            if (data.error) { toast(data.error, 'error'); } else { toast(`已轉至 ${data.ticket.serviceType}`, 'success'); }
            await refresh();
        };

        $('#callSpecific').onclick = async () => {
            const id = $('#ticketInternalId').value; if (!id) { alert('請選取一筆叫號或輸入 ticketId'); return; }
            const counter = ($('#counter').value || '').trim();
            if (!counter) { alert('櫃台號未設定，請聯絡管理員設定您的櫃台號'); return; }
            const res = await apiFetch('/api/agent/callSpecific', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ticketId: Number(id), counter })
            });
            const data = await res.json();
            if (data.error) {
                toast(data.error, 'error');
            } else {
                toast(`指定叫號 ${data.ticket.number}`, 'success');
                const vis = document.querySelector('#ticketId');
                const hid = document.querySelector('#ticketInternalId');
                if (vis) vis.value = data.ticket.number || '';
                if (hid) hid.value = data.ticket.id || '';
                try { setSelectedInfo({ number: data.ticket.number, counter: data.ticket.counter, phone: data.ticket.phone, id: data.ticket.id, serviceType: data.ticket.serviceType }); } catch (e) { /* noop */ }
            }
            await refresh();
        };

        $('#createTicket').onclick = async () => {

            showPhoneModal(async (phone) => {
                const serviceType = document.querySelector('#serviceType').value;
                const res = await apiFetch('/api/agent/createTicket', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ serviceType, phone })
                });
                const data = await res.json();
                if (data.error) { toast(data.error, 'error'); } else { toast(`\u5df2\u5efa\u7acb ${data.ticket.number}`, 'success'); }
                await refresh();
            });
        };

        // 未取號補取（與 櫃台取號 相同 API，但顯示不同文案）
        $('#pickup').onclick = async () => {
            showPhoneModal(async (phone) => {
                const serviceType = document.querySelector('#serviceType').value;
                const res = await apiFetch('/api/agent/createTicket', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ serviceType, phone })
                });
                const data = await res.json();
                if (data.error) { toast(data.error, 'error'); } else { toast(`\u5df2\u88dc\u53d6 ${data.ticket.number}`, 'success'); }
                await refresh();
            });
        };

        // 暫停服務：將目前選擇的 ticket 狀態轉為 waiting（相當於 transfer keepStatus=false 保持原服務別與櫃台清空）
        $('#pause').onclick = async () => {
            const id = $('#ticketInternalId').value; if (!id) { alert('請選擇一筆叫號'); return; }
            const res = await apiFetch('/api/agent/transfer', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ticketId: Number(id), keepStatus: false })
            });
            const data = await res.json();
            if (data.error) { toast(data.error, 'error'); } else { toast('已暫停，票券回到等待', 'success'); }
            await refresh();
        };

        // 內部叫號：不對外廣播，只更新狀態與叫號時間
        $('#internalCall').onclick = async () => {
            const id = $('#ticketInternalId').value; if (!id) { alert('請選擇一筆叫號或輸入 ticketId'); return; }
            const counter = ($('#counter').value || '').trim();
            if (!counter) { alert('櫃台號未設定，請聯絡管理員設定您的櫃台號'); return; }
            const res = await apiFetch('/api/agent/callSpecific', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ticketId: Number(id), counter, internal: true })
            });
            const data = await res.json();
            if (data.error) {
                toast(data.error, 'error');
            } else {
                toast(`內部叫號 ${data.ticket.number}`, 'success');
                const vis = document.querySelector('#ticketId');
                const hid = document.querySelector('#ticketInternalId');
                if (vis) vis.value = data.ticket.number || '';
                if (hid) hid.value = data.ticket.id || '';
                try { setSelectedInfo({ number: data.ticket.number, counter: data.ticket.counter, phone: data.ticket.phone, id: data.ticket.id, serviceType: data.ticket.serviceType }); } catch (e) { /* noop */ }
            }
            await refresh();
        };

        // 歷史查詢：拉取最近 100 筆已完成/取消
        $('#history').onclick = async () => {
            const serviceType = document.querySelector('#serviceType').value;
            const res = await apiFetch(`/api/agent/history?limit=100&serviceType=${encodeURIComponent(serviceType)}`);
            const data = await res.json();
            if (!res.ok || data.error) { alert(data.error || '查詢失敗'); return; }
            const rows = data.tickets || [];
            const html = rows.length ? (`<table class="table"><thead><tr><th>號碼</th><th>狀態</th><th>櫃台</th><th>完成時間</th></tr></thead><tbody>` +
                rows.map(t => `<tr><td>${t.number}</td><td>${statusLabel(t.status)}</td><td>${t.counter || '-'}</td><td>${t.finishedAt ? new Date(t.finishedAt).toLocaleString() : '-'}</td></tr>`).join('') + `</tbody></table>`) : '<div class="muted">無資料</div>';
            document.querySelector('#historyBody').innerHTML = html;
            document.querySelector('#historyModal').classList.remove('hidden');
        };
        document.querySelector('#historyClose').onclick = () => document.querySelector('#historyModal').classList.add('hidden');

        // 密傳訊息：發送給所有櫃員端（簡易廣播）
        $('#message').onclick = async () => {
                const text = prompt('輸入要傳送的訊息');
            if (!text) return;
                // Ask for optional target: counter or agent name
                const targetType = prompt('指定傳送對象類型：輸入 C 表示櫃台，A 表示人員，留空表示廣播');
                let toCounter = null;
                let toAgent = null;
                if (targetType && (targetType === 'C' || targetType === 'c')) {
                    const ctr = prompt('輸入目標櫃台號（例如：1 或 A1）');
                    if (!ctr) { alert('未輸入櫃台，取消'); return; }
                    toCounter = ctr;
                } else if (targetType && (targetType === 'A' || targetType === 'a')) {
                    const ag = prompt('輸入目標服務人員姓名（完全匹配）');
                    if (!ag) { alert('未輸入姓名，取消'); return; }
                    toAgent = ag;
                }
                const body = { text, from: agentName || 'agent' };
                if (toCounter) body.toCounter = toCounter;
                if (toAgent) body.toAgent = toAgent;
                const res = await apiFetch('/api/agent/message', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                if (!res.ok || data.error) { alert(data.error || '傳送失敗'); return; }
                toast('已送出訊息', 'success');
        };

        // phone modal helpers
        function showPhoneModal(cb) {
            const modal = document.getElementById('phoneInputModal');
            const input = document.getElementById('modalPhone');
            modal.classList.remove('hidden');
            input.value = '';
            input.focus();
            const onlyDigits = (s) => (s || '').replace(/\D/g, '');
            const onCancel = () => { modal.classList.add('hidden'); cleanup(); };
            const onOk = () => {
                const val = input.value.trim();
                const digits = onlyDigits(val);
                if (!digits || digits.length < 6) { alert('請輸入有效的電話號碼（至少 6 位數）'); input.focus(); return; }
                modal.classList.add('hidden'); cleanup(); cb(digits);
            };
            const cleanup = () => { document.getElementById('modalCancel').removeEventListener('click', onCancel); document.getElementById('modalOk').removeEventListener('click', onOk); };
            document.getElementById('modalCancel').addEventListener('click', onCancel);
            document.getElementById('modalOk').addEventListener('click', onOk);
        }

        // service buttons and quick counters are rendered and bound inside renderCategoryList

        // keyboard shortcuts
        window.addEventListener('keydown', (e) => {
            if (e.target && ['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
            if (e.key === 'n' || e.key === 'N') { e.preventDefault(); document.querySelector('#callNext').click(); }
            if (e.key === 's' || e.key === 'S') { e.preventDefault(); document.querySelector('#markServing').click(); }
            if (e.key === 'f' || e.key === 'F') { e.preventDefault(); document.querySelector('#finish').click(); }
            if (e.key === 'x' || e.key === 'X') { e.preventDefault(); document.querySelector('#cancel').click(); }
        });

        // open second screen
        document.querySelector('#openSecondScreen').onclick = () => { window.open('/lobby/index.html', '_blank'); };

        // Counter is now read-only and set by admin via login system
        // Socket room management is handled during login/logout
        const counterEl = document.querySelector('#counter');
        // Counter field is read-only, no manual changes allowed

        // no initServiceButtons needed when service buttons are not rendered here
    </script>
</body>

</html>
