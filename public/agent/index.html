<!doctype html>
<html lang="zh-Hant">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>櫃員端</title>
    <link rel="stylesheet" href="/agent/style.css" />
    <script src="/socket.io/socket.io.js"></script>
</head>

<body>
    <div class="container agent-red">

        <!-- Header / Tabs -->
        <div class="agent-header">
            <div class="left">
                <h1 class="title">櫃員設定</h1>
                <div class="agent-meta">
                    <span>服務人員：</span><strong id="agentNameDisplay">—</strong>
                </div>
            </div>
            <div class="right">
                <div class="tabbar">
                    <button id="openSecondScreen" class="tab active">第二螢幕</button>
                    <button class="tab" disabled>滿意度評鑑</button>
                    <button class="tab" disabled>重新評鑑</button>
                </div>
                <!-- auth controls (PIN removed) -->
                <div class="auth compact">
                    <button class="btn btn-light" id="logoutBtn" title="登出">登出</button>
                    <span id="authStatus" class="muted"></span>
                </div>
            </div>
        </div>

        <!-- Info + Stats + Service/Counter small controls -->
        <div class="top-info">
            <div class="info-grid">
                <div class="info-field">
                    <label>目前叫號</label>
                    <input id="currentCallField" readonly placeholder="—" />
                </div>
                <div class="info-field">
                    <label>等候時間</label>
                    <input id="waitTimeField" readonly placeholder="—" />
                </div>
                <div class="info-field">
                    <label>服務時間</label>
                    <input id="serviceTimeField" readonly placeholder="—" />
                </div>
                <div class="info-field smallctrl">
                    <label>櫃台號</label>
                    <div class="counter-group">
                        <input id="counter" placeholder="1" />
                    </div>
                </div>
            </div>

            <div class="stats-box">
                <div class="stat">
                    <div class="label">等待人數（本櫃）</div>
                    <div class="value" id="localWaitCount">0</div>
                </div>
                <div class="stat">
                    <div class="label">等待人數（本行）</div>
                    <div class="value" id="totalWaitCount">0</div>
                </div>
            </div>
        </div>

        <!-- Service selector (compact) -->
        <div class="service-compact">
            <label>服務類型</label>
            <div class="service-buttons" id="serviceButtons">
                <button class="btn btn-light active" data-service="A">一般保險服務</button>
                <button class="btn btn-light" data-service="B">理賠送件服務</button>
                <button class="btn btn-light" data-service="C">保單借據服務</button>
                <button class="btn btn-light" data-service="D">繳費服務</button>
                <button class="btn btn-light" data-service="E">人生設計所保險諮詢</button>
            </div>
            <input type="hidden" id="serviceType" value="A" />
        </div>

        <!-- Operations matrix -->
        <div class="ops-grid">
            <button class="btn btn-primary op" id="callNext" title="N">叫號</button>
            <button class="btn btn-secondary op" id="markServing" title="S">開始服務</button>
            <button class="btn btn-primary op outline" id="recall" title="R">重叫號</button>
            <button class="btn btn-success op" id="finish" title="F">結束服務</button>
            <button class="btn btn-danger op" id="cancel" title="X">取消叫號</button>

            <button class="btn btn-light op" id="transfer">轉櫃/轉服務</button>
            <button class="btn btn-light op" id="createTicket">櫃檯取號</button>
            <button class="btn btn-light op" id="pickup">未取號補取</button>
            <button class="btn btn-light op" id="internalCall">內部叫號</button>

            <button class="btn btn-light op" id="pause">暫停服務</button>
            <button class="btn btn-light op" id="callSpecific">指定叫號</button>
            <button class="btn btn-light op" id="history">歷史叫號查詢</button>
            <button class="btn btn-light op" id="message">密傳訊息</button>
        </div>

        <div class="verify-line">
            <input id="ticketId" placeholder="ticket id" />
        </div>

        <!-- Hidden original tables (kept for JS compatibility) -->
        <div class="legacy-panels hidden">
            <div class="grid">
                <div class="panel">
                    <h3>目前等待</h3>
                    <table class="table">
                        <thead>
                            <tr>
                                <th>號碼</th>
                                <th>時間</th>
                                <th>電話</th>
                            </tr>
                        </thead>
                        <tbody id="waiting"></tbody>
                    </table>
                </div>

                <div class="panel">
                    <h3>目前叫號 / 服務中</h3>
                    <table class="table">
                        <thead>
                            <tr>
                                <th>號碼</th>
                                <th>櫃台</th>
                                <th>叫號時間</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="current"></tbody>
                    </table>
                    <div id="selectedInfo" class="selected-info muted"></div>
                </div>
            </div>
        </div>

        <!-- Footer clock and category list -->
        <div class="footer-info">
            <div class="clock" id="clock">—</div>
            <h3 class="section-title">客戶等候名單</h3>
            <div id="categoryList" class="category-list"></div>
        </div>

    </div>

    <div id="toaster" class="toaster"></div>

    <!-- Local overlay fallback login (kept for backward-compat) -->
    <div id="authOverlay" class="auth-overlay hidden">
        <div class="auth-card">
            <h2>櫃員登入</h2>
            <label>姓名</label>
            <input id="loginName" placeholder="輸入姓名" />
            <label>櫃台（選填）</label>
            <input id="loginCounter" placeholder="櫃台編號" />
            <div class="actions" style="margin-top:12px;display:flex;justify-content:flex-end;gap:8px">
                <button id="loginBtn" class="btn btn-primary">登入</button>
            </div>
        </div>
    </div>

    <!-- Phone input modal for create/pickup -->
    <div id="phoneInputModal" class="auth-overlay hidden">
        <div class="auth-card">
            <h2>輸入電話（必填）</h2>
            <label>電話</label>
            <input id="modalPhone" placeholder="0912345678" required />
            <div class="actions" style="margin-top:12px;display:flex;justify-content:flex-end;gap:8px">
                <button id="modalCancel" class="btn btn-light">取消</button>
                <button id="modalOk" class="btn btn-primary">確定</button>
            </div>
        </div>
    </div>

    <script>
        const $ = (s) => document.querySelector(s);
    const socket = io();
    let agentName = sessionStorage.getItem('agent_name') || '';
    let savedCounter = sessionStorage.getItem('agent_counter') || '';

        function updateAgentNameUI() { $('#agentNameDisplay').textContent = agentName || '—'; }

    if (savedCounter) { const c = document.querySelector('#counter'); if (c && !c.value) c.value = savedCounter; }
    if (agentName) document.querySelector('#authStatus').textContent = '已登入';
    updateAgentNameUI();

        // overlay login
        function showOverlay() { document.querySelector('#authOverlay').classList.remove('hidden'); }
        function hideOverlay() { document.querySelector('#authOverlay').classList.add('hidden'); }
        // If there's no stored agent info, redirect to the centralized login page and request return to this page.
        if (!agentName) {
            const redirect = encodeURIComponent('/agent/index.html');
            window.location.href = `/login/index.html?redirect=${redirect}`;
        }
        document.querySelector('#loginBtn').onclick = () => {
            const nm = document.querySelector('#loginName').value.trim();
            const ctr = document.querySelector('#loginCounter').value.trim();
            if (!nm) { alert('請輸入姓名'); return; }
            agentName = nm; savedCounter = ctr;
            if (agentName) sessionStorage.setItem('agent_name', agentName);
            if (savedCounter) sessionStorage.setItem('agent_counter', savedCounter);
            if (savedCounter) { const c = document.querySelector('#counter'); if (c) c.value = savedCounter; }
            document.querySelector('#authStatus').textContent = '已登入';
            updateAgentNameUI();
            hideOverlay();
            refresh();
        };
        document.querySelector('#logoutBtn').onclick = () => {
            sessionStorage.removeItem('agent_name');
            sessionStorage.removeItem('agent_counter');
            document.querySelector('#authStatus').textContent = '';
            updateAgentNameUI();
            // After logout, send user back to the login page handled by /public/login
            window.location.href = '/login/index.html';
        };

        function maskPhone(p) { if (!p) return ''; return String(p).replace(/(\d{3})\d{4}(\d{3,4})/, '$1****$2'); }

        function toast(msg, type = 'info') {
            const el = document.createElement('div');
            el.className = `toast ${type}`;
            el.textContent = msg;
            document.querySelector('#toaster').appendChild(el);
            setTimeout(() => { el.classList.add('show'); }, 10);
            setTimeout(() => { el.classList.remove('show'); el.remove(); }, 3000);
        }

        // apiFetch wrapper: attach x-agent-name header for demo auth
        async function apiFetch(url, opts={}){
            opts = Object.assign({ headers: {} }, opts);
            const name = sessionStorage.getItem('agent_name');
            if(name){
                // HTTP header values may reject non ISO-8859-1 chars in some browsers.
                // Encode to percent-encoding to ensure safe transport.
                try { opts.headers['x-agent-name'] = encodeURIComponent(name); } catch(e) { opts.headers['x-agent-name'] = name; }
            }
            return fetch(url, opts);
        }

        function setSelectedInfo(ticket) {
            const el = document.querySelector('#selectedInfo');
            if (!el) return;
            if (!ticket) { el.textContent = ''; return; }
            const phoneMasked = maskPhone(ticket.phone);
            el.innerHTML = `選取：<strong>${ticket.number}</strong>，櫃台 ${ticket.counter || '-'}，電話 ${phoneMasked || '-'}`;
        }

        function updateClock() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            const ss = String(now.getSeconds()).padStart(2, '0');
            const str = `${y}/${m}/${d} ${hh}:${mm}:${ss}`;
            const clk = document.querySelector('#clock'); if (clk) clk.textContent = str;
        }
        setInterval(updateClock, 1000); updateClock();

        function renderCategoryList(summary) {
            // Keep the label mapping consistent with the service buttons in the UI
            const SERVICE_NAMES = {
                A: '一般保險服務',
                B: '理賠送件服務',
                C: '保單借據服務',
                D: '繳費服務',
                E: '人生設計所保險諮詢'
            };
            // Standard order A..E
            const order = ['A', 'B', 'C', 'D', 'E'];
            const map = (summary || []).reduce((acc, s) => { acc[s.serviceType] = s.waiting || 0; return acc; }, {});
            const html = order.map(code => {
                const count = map[code] || 0;
                return `<div class="category-row" data-service="${code}" style="cursor:pointer"><div class="count">${count}</div><div class="label">${SERVICE_NAMES[code] || code}</div></div>`;
            }).join('');
            const wrap = document.querySelector('#categoryList');
            if (wrap) {
                wrap.innerHTML = html;
                // click to select serviceType and refresh
                wrap.querySelectorAll('.category-row').forEach(el => {
                    el.onclick = () => {
                        const svc = el.getAttribute('data-service');
                        const svcInput = document.querySelector('#serviceType');
                        if (svcInput) svcInput.value = svc;
                        // update active button state
                        document.querySelectorAll('#serviceButtons [data-service]').forEach(b => b.classList.remove('active'));
                        const btn = document.querySelector(`#serviceButtons [data-service="${svc}"]`);
                        if (btn) btn.classList.add('active');
                        refresh();
                    };
                });
            }
        }

        async function refresh() {
            const res = await apiFetch('/api/overview');
            const data = await res.json();
            const serviceType = document.querySelector('#serviceType').value;

            // update waiting table (legacy)
            const waitingRes = await apiFetch(`/api/tickets/waiting?serviceType=${serviceType}`);
            const waitingData = await waitingRes.json();
            const waitingTbody = document.querySelector('#waiting');
            if (waitingTbody) {
                waitingTbody.innerHTML = waitingData.tickets.map(t =>
                    `<tr class="clickable" data-waiting-id="${t.id}">
            <td>${t.number}</td>
            <td>${new Date(t.createdAt).toLocaleTimeString()}</td>
            <td>${maskPhone(t.phone)}</td>
          </tr>`
                ).join('') || '<tr><td colspan="3">無</td></tr>';
            }

            const currentTbody = document.querySelector('#current');
            if (currentTbody) {
                currentTbody.innerHTML = (data.currentCalls || []).map(c =>
                    `<tr class="clickable" data-id="${c.id}">
            <td><span class="badge">${c.serviceType}</span> ${c.number}</td>
            <td>${c.counter || '-'}</td>
            <td>${new Date(c.calledAt).toLocaleTimeString()}</td>
            <td><button class="btn btn-light" data-pick="${c.id}">選取</button></td>
          </tr>`
                ).join('') || '<tr><td colspan="4">無</td></tr>';
            }

            document.querySelectorAll('[data-id]').forEach(tr => {
                tr.onclick = () => { document.querySelector('#ticketId').value = tr.getAttribute('data-id'); };
            });
            document.querySelectorAll('button[data-pick]').forEach(btn => {
                btn.onclick = (e) => { e.stopPropagation(); document.querySelector('#ticketId').value = btn.getAttribute('data-pick'); };
            });

            const sel = Number(document.querySelector('#ticketId').value);
            const cur = (data.currentCalls || []).find(x => x.id === sel);
            setSelectedInfo(cur || null);

            // Stats: local (selected service waiting), total (sum waiting)
            const summary = data.summary || [];
            const sumMap = summary.reduce((acc, s) => { acc[s.serviceType] = s.waiting || 0; return acc; }, {});
            const local = sumMap[serviceType] || 0;
            const total = summary.reduce((n, s) => n + (s.waiting || 0), 0);
            const lw = document.querySelector('#localWaitCount'); if (lw) lw.textContent = local;
            const tw = document.querySelector('#totalWaitCount'); if (tw) tw.textContent = total;

            // Info fields
            const firstWaiting = waitingData.tickets?.[0];
            const waitField = document.querySelector('#waitTimeField');
            if (waitField) {
                if (firstWaiting) {
                    const mins = Math.max(0, Math.floor((Date.now() - new Date(firstWaiting.createdAt).getTime()) / 60000));
                    waitField.value = `${mins} 分鐘`;
                } else { waitField.value = '—'; }
            }
            const currentCallField = document.querySelector('#currentCallField');
            if (currentCallField) { currentCallField.value = cur ? cur.number : '—'; }
            const serviceTimeField = document.querySelector('#serviceTimeField');
            if (serviceTimeField) {
                if (cur && cur.calledAt) {
                    const mins = Math.max(0, Math.floor((Date.now() - new Date(cur.calledAt).getTime()) / 60000));
                    serviceTimeField.value = `${mins} 分鐘`;
                } else { serviceTimeField.value = '—'; }
            }

            renderCategoryList(summary);
        }

        // Existing handlers (mostly unchanged)
        $('#callNext').onclick = async () => {
            const serviceType = $('#serviceType').value;
            const counter = $('#counter').value || undefined;
            const res = await apiFetch('/api/agent/callNext', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ serviceType, counter })
            });
            const data = await res.json();
            if (data.error) { toast(data.error, 'error'); } else { toast(`已叫號 ${data.ticket.number}`, 'success'); document.querySelector('#ticketId').value = data.ticket.id; }
            await refresh();
        };

        socket.on('queue:update', refresh);
        socket.on('call:made', refresh);
        refresh();

        $('#markServing').onclick = async () => {
            const id = $('#ticketId').value;
            if (!id) { alert('請選取一筆叫號'); return; }
            // fetch ticket to get full phone (not masked)
            const ticketRes = await apiFetch(`/api/ticket/${Number(id)}`);
            if (!ticketRes.ok) {
                const j = await ticketRes.json().catch(()=>({ error: '查詢失敗' }));
                alert(j && j.error ? j.error : '取得票券失敗');
                return;
            }
            const ticketJson = await ticketRes.json();
            const ticket = ticketJson.ticket;
            const phoneDigits = ticket && ticket.phone ? String(ticket.phone).replace(/\D/g, '') : '';
            if (!phoneDigits) {
                alert('此票券未紀錄電話，無法透過電話後四碼驗證開始服務');
                return;
            }
            const last4 = phoneDigits.slice(-4);
            const v = prompt('請輸入客戶電話後四碼以開始服務');
            if (v === null) return; // user cancelled
            if (String(v).trim() !== String(last4)) { alert('電話後四碼驗證失敗'); return; }
            // verified, proceed to mark serving
            const res = await apiFetch('/api/agent/markServing', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ticketId: Number(id) })
            });
            const data = await res.json();
            if (data.error) { toast(data.error, 'error'); } else { toast(`已開始服務 ${data.ticket.number}`, 'success'); }
            await refresh();
        };

        $('#finish').onclick = async () => {
            const id = $('#ticketId').value;
            if (!id) { alert('請選取一筆叫號'); return; }
            const result = prompt('處理結果（備註，可留空）') || undefined;
            const v4 = ($('#verify4').value || '').trim();
            const res = await apiFetch('/api/agent/finish', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ticketId: Number(id), result, verify4: v4 || undefined })
            });
            const data = await res.json();
            if (data.error) { toast(data.error, 'error'); } else { toast(`已完成 ${data.ticket.number}`, 'success'); document.querySelector('#ticketId').value = ''; document.querySelector('#verify4').value = ''; setSelectedInfo(null); }
            await refresh();
        };

        $('#recall').onclick = async () => {
            const id = $('#ticketId').value; if (!id) { alert('請選取一筆叫號'); return; }
            const res = await apiFetch('/api/agent/recall', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ticketId: Number(id) })
            });
            const data = await res.json();
            if (data.error) { toast(data.error, 'error'); } else { toast(`重叫 ${data.ticket.number}`, 'success'); }
            await refresh();
        };

        $('#cancel').onclick = async () => {
            const id = $('#ticketId').value; if (!id) { alert('請選取一筆叫號'); return; }
            const reason = prompt('取消原因（可留空）') || undefined;
            const res = await apiFetch('/api/agent/cancel', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ticketId: Number(id), reason })
            });
            const data = await res.json();
            if (data.error) { toast(data.error, 'error'); } else { toast(`已取消 ${id}`, 'success'); }
            await refresh();
        };

        $('#transfer').onclick = async () => {
            const id = $('#ticketId').value; if (!id) { alert('請選取一筆叫號'); return; }
            const toServiceType = prompt('轉至服務類型（A/B/C/D/E，不填維持）') || undefined;
            const toCounter = prompt('指定櫃台（可留空）') || undefined;
            const keepStatus = confirm('保持狀態與叫號時間？按 確定 保持 / 取消 重置為等待');
            const res = await apiFetch('/api/agent/transfer', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ticketId: Number(id), toServiceType, toCounter, keepStatus })
            });
            const data = await res.json();
            if (data.error) { toast(data.error, 'error'); } else { toast(`已轉至 ${data.ticket.serviceType}`, 'success'); }
            await refresh();
        };

        $('#callSpecific').onclick = async () => {
            const id = $('#ticketId').value; if (!id) { alert('請選取一筆叫號或輸入 ticketId'); return; }
            const counter = $('#counter').value || undefined;
            const res = await apiFetch('/api/agent/callSpecific', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ticketId: Number(id), counter })
            });
            const data = await res.json();
            if (data.error) { toast(data.error, 'error'); } else { toast(`指定叫號 ${data.ticket.number}`, 'success'); }
            await refresh();
        };

        $('#createTicket').onclick = async () => {
            
            showPhoneModal(async (phone) => {
                const serviceType = document.querySelector('#serviceType').value;
                const res = await apiFetch('/api/agent/createTicket', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ serviceType, phone })
                });
                const data = await res.json();
                if (data.error) { toast(data.error, 'error'); } else { toast(`\u5df2\u5efa\u7acb ${data.ticket.number}`, 'success'); }
                await refresh();
            });
         };

        // 未取號補取（與 櫃台取號 相同 API，但顯示不同文案）
        $('#pickup').onclick = async () => {
            showPhoneModal(async (phone) => {
                const serviceType = document.querySelector('#serviceType').value;
                const res = await apiFetch('/api/agent/createTicket', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ serviceType, phone })
                });
                const data = await res.json();
                if (data.error) { toast(data.error, 'error'); } else { toast(`\u5df2\u88dc\u53d6 ${data.ticket.number}`, 'success'); }
                await refresh();
            });
         };

        // phone modal helpers
        function showPhoneModal(cb){
            const modal = document.getElementById('phoneInputModal');
            const input = document.getElementById('modalPhone');
            modal.classList.remove('hidden');
            input.value = '';
            input.focus();
            const onlyDigits = (s) => (s||'').replace(/\D/g, '');
            const onCancel = () => { modal.classList.add('hidden'); cleanup(); };
            const onOk = () => {
                const val = input.value.trim();
                const digits = onlyDigits(val);
                if (!digits || digits.length < 6) { alert('請輸入有效的電話號碼（至少 6 位數）'); input.focus(); return; }
                modal.classList.add('hidden'); cleanup(); cb(digits);
            };
            const cleanup = () => { document.getElementById('modalCancel').removeEventListener('click', onCancel); document.getElementById('modalOk').removeEventListener('click', onOk); };
            document.getElementById('modalCancel').addEventListener('click', onCancel);
            document.getElementById('modalOk').addEventListener('click', onOk);
        }

        // service buttons
        document.querySelectorAll('#serviceButtons [data-service]').forEach(btn => {
            btn.onclick = () => {
                document.querySelector('#serviceType').value = btn.getAttribute('data-service');
                document.querySelectorAll('#serviceButtons [data-service]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                refresh();
            };
        });

        // quick counter buttons
        document.querySelectorAll('[data-counter]').forEach(btn => {
            btn.onclick = () => { document.querySelector('#counter').value = btn.getAttribute('data-counter'); };
        });

        // keyboard shortcuts
        window.addEventListener('keydown', (e) => {
            if (e.target && ['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
            if (e.key === 'n' || e.key === 'N') { e.preventDefault(); document.querySelector('#callNext').click(); }
            if (e.key === 's' || e.key === 'S') { e.preventDefault(); document.querySelector('#markServing').click(); }
            if (e.key === 'f' || e.key === 'F') { e.preventDefault(); document.querySelector('#finish').click(); }
        });

        // open second screen
