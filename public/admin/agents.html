<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agents 管理</title>
  <link rel="stylesheet" href="/admin/style.css" />
</head>

<body>
  <div class="card">
    <h1 id="pageTitle">帳號管理</h1>
    <div id="loginRedirect">
      <p>正在重定向到登入頁面...</p>
      <p class="muted">如果沒有自動跳轉，請<a href="/login/index.html">點擊這裡</a>手動登入</p>
    </div>
    <div id="mainArea" class="hidden">
      <div class="flex-between-center">
        <strong id="loginStatus">已登入</strong>
        <div class="actions">
          <button id="logout" class="small">登出</button>
        </div>
      </div>
      <div id="adminSection" class="hidden">
        <div class="mt-12">
          <h3>建立新帳號</h3>
          <label for="newAccount">帳號 (account)</label>
          <input id="newAccount" placeholder="輸入帳號" />
          <label for="newName">姓名 (name)</label>
          <input id="newName" placeholder="輸入姓名（可留空）" />
          <div class="row">
            <div><label for="newPassword">密碼</label><input id="newPassword" type="password" placeholder="輸入密碼" /></div>
            <div><label for="newCounter">櫃台</label><input id="newCounter" placeholder="例如 A1, B2, 1號" /></div>
            <div><label for="newRole">角色</label>
              <select id="newRole">
                <option value="">一般櫃員</option>
                <option value="admin">管理員</option>
              </select>
            </div>
          </div>
          <div class="mt-8"><button id="createBtn">建立</button></div>
        </div>
        <div class="mt-18">
          <div class="flex-between-center">
            <h3>現有帳號</h3>
            <input id="agentFilter" class="filter" type="search" placeholder="搜尋帳號、姓名或櫃台" />
          </div>
          <div id="agentsWrap">載入中…</div>
        </div>
      </div>
      <dialog id="editDialog">
        <form id="editForm" method="dialog">
          <h3>編輯帳號 <span id="editAccount" class="muted"></span></h3>
          <label for="editName">姓名</label>
          <input id="editName" placeholder="留空則以帳號顯示" />
          <div class="row">
            <div><label for="editCounter">櫃台</label><input id="editCounter" placeholder="例如 A1, B2, 1號" /></div>
            <div><label for="editRole">角色</label>
              <select id="editRole">
                <option value="">一般櫃員</option>
                <option value="admin">管理員</option>
              </select>
            </div>
          </div>
          <label class="checkbox"><input id="editActive" type="checkbox" /> 啟用（停用會立即登出該帳號）</label>
          <label for="editPassword">重設密碼（留空表示不更改）</label>
          <input id="editPassword" type="password" placeholder="輸入新密碼" autocomplete="new-password" />
          <p id="editSelfNote" class="muted hidden">這是你目前登入的帳號，無法變更自己的角色或停用。</p>
          <div class="dialog-actions">
            <button type="button" id="editCancel" class="secondary">取消</button>
            <button type="submit" id="editSave">儲存</button>
          </div>
        </form>
      </dialog>
      <div id="profileSection" class="hidden">
        <div class="mt-12">
          <h3>個人資料編輯</h3>
          <label for="profileName">姓名</label>
          <input id="profileName" placeholder="輸入姓名" />
          <label for="profilePassword">新密碼（留空表示不更改）</label>
          <input id="profilePassword" type="password" placeholder="輸入新密碼" />
          <label for="profileCurrentPassword">目前密碼（變更密碼時必填）</label>
          <input id="profileCurrentPassword" type="password" placeholder="輸入目前密碼" autocomplete="current-password" />
          <div class="mt-8">
            <button id="updateProfileBtn">更新個人資料</button>
          </div>
        </div>
        <div class="mt-18">
          <h3>帳號資訊</h3>
          <div class="readonly-info">
            <div><strong>角色：</strong><span id="profileRole">-</span></div>
            <div><strong>帳號：</strong><span id="profileAccount">-</span></div>
            <div><strong>姓名：</strong><span id="profileDisplayName">-</span></div>
            <div><strong>櫃號：</strong><span id="profileDisplayCounter">-</span></div>
          </div>
        </div>
      </div>
    </div>
    <div id="msg" class="notice hidden"></div>
  </div>
  <script src="/admin/agents.js"></script>
</body>

</html>
