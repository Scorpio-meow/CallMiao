<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agents 管理</title>
  <link rel="stylesheet" href="/admin/style.css" />
  <script src="/socket.io/socket.io.js"></script>
  <script defer src="/admin/app.js"></script>
</head>
<body>
  <div class="card">
    <h1>帳號管理</h1>
    <div id="mainArea">
      <div class="row-between">
        <strong>已登入為管理員</strong>
        <div class="actions">
          <button id="logout" class="small">登出</button>
        </div>
      </div>

      <div class="mt-12">
        <h3>建立新帳號</h3>
        <label>帳號 (account)</label>
        <input id="newAccount" />
        <label>姓名 (name)</label>
        <input id="newName" />
        <div class="row">
          <div><label>密碼</label><input id="newPassword" type="password" /></div>
          <div><label>櫃台</label><input id="newCounter" /></div>
        </div>
        <div class="mt-8"><button id="createBtn">建立</button></div>
      </div>

      <div class="mt-18">
        <h3>現有帳號</h3>
        <div id="agentsWrap">載入中…</div>
      </div>
    </div>

    <div id="msg" class="notice hidden"></div>
  </div>
</body>
</html>
