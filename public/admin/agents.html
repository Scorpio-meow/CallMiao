<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agents 管理</title>
  <link rel="stylesheet" href="/admin/style.css" />
  <script src="/utils/url-manager.js"></script>
</head>

<body>
  <div class="card">
    <h1 id="pageTitle">帳號管理</h1>
    
    <!-- Login redirect message -->
    <div id="loginRedirect">
      <p>正在重定向到登入頁面...</p>
      <p class="muted">如果沒有自動跳轉，請<a href="/login/index.html">點擊這裡</a>手動登入</p>
    </div>

    <div id="mainArea" class="hidden">
      <div class="flex-between-center">
        <strong id="loginStatus">已登入</strong>
        <div class="actions">
          <button id="logout" class="small">登出</button>
        </div>
      </div>

      <!-- Admin-only sections -->
      <div id="adminSection" class="hidden">
        <div class="mt-12">
          <h3>建立新帳號</h3>
          <label for="newAccount">帳號 (account)</label>
          <input id="newAccount" placeholder="輸入帳號" />
          <label for="newName">姓名 (name)</label>
          <input id="newName" placeholder="輸入姓名（可留空）" />
          <div class="row">
            <div><label for="newPassword">密碼</label><input id="newPassword" type="password" placeholder="輸入密碼" /></div>
            <div><label for="newCounter">櫃台</label><input id="newCounter" placeholder="例如 A1, B2, 1號" /></div>
            <div><label for="newRole">角色</label>
              <select id="newRole">
                <option value="">一般櫃員</option>
                <option value="admin">管理員</option>
              </select>
            </div>
          </div>
          <div class="mt-8"><button id="createBtn">建立</button></div>
        </div>

        <div class="mt-18">
          <h3>現有帳號</h3>
          <div id="agentsWrap">載入中…</div>
        </div>
      </div>

      <!-- Agent profile section -->
      <div id="profileSection" class="hidden">
        <div class="mt-12">
          <h3>個人資料編輯</h3>
          <label for="profileName">姓名</label>
          <input id="profileName" placeholder="輸入姓名" />
          <label for="profileCounter">櫃台號碼</label>
          <input id="profileCounter" type="text" placeholder="例如 A1, B2, 1號" />
          <label for="profilePassword">新密碼（留空表示不更改）</label>
          <input id="profilePassword" type="password" placeholder="輸入新密碼" />
          <div class="mt-8">
            <button id="updateProfileBtn">更新個人資料</button>
          </div>
        </div>
          
        <div class="mt-18">
          <h3>帳號資訊</h3>
          <div class="readonly-info">
            <div><strong>角色：</strong><span id="profileRole">-</span></div>
            <div><strong>帳號：</strong><span id="profileAccount">-</span></div>
            <div><strong>姓名：</strong><span id="profileDisplayName">-</span></div>
            <div><strong>櫃號：</strong><span id="profileDisplayCounter">-</span></div>
          </div>
        </div>
      </div>
    </div>

  <div id="msg" class="notice hidden"></div>
  </div>

  <script>
    // Check user role and initialize appropriate interface
    let USER_MODE = 'agent'; // 'admin' or 'agent'
    let CURRENT_AGENT = null;
    
    // 使用 URL Manager
    const urlManager = window.URLManager;
    
    // 移除 PIN 認證，改為依賴登入狀態
    
    function showMsg(text, err) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.classList.remove('hidden');
      el.classList.remove('ok','error');
      el.classList.add(err ? 'error' : 'ok');
      setTimeout(() => el.classList.add('hidden'), 4000);
    }

    // Check if user is logged in and has appropriate permissions
    async function checkLoginAndPermissions() {
      const agentName = sessionStorage.getItem('agent_name');
      const agentRole = sessionStorage.getItem('agent_role');
      const agentAccount = sessionStorage.getItem('agent_account');
      
      if (!agentName || !agentAccount) {
        // 使用 URL Manager 跳轉到登入頁面
        console.log('Admin - 未登入，跳轉到登入頁面');
        await urlManager.redirectToLogin();
        return false;
      }
      
      // User is logged in, determine what they can access
      if (agentRole === 'admin') {
        USER_MODE = 'admin';
        initializeAdminInterface();
      } else {
        USER_MODE = 'agent';
        initializeAgentInterface();
      }
      
      return true;
    }

    async function apiFetch(url, opts = {}) {
      opts = Object.assign({ headers: {} }, opts);
      
      if (!opts.headers['Content-Type']) opts.headers['Content-Type'] = 'application/json';
      
      // Add agent authentication for agent profile API
      const agentAccount = sessionStorage.getItem('agent_account');
      const agentName = sessionStorage.getItem('agent_name');
      if (agentAccount && url.includes('/api/agent/')) {
        opts.headers['x-agent-account'] = agentAccount;
        opts.headers['x-agent-name'] = encodeURIComponent(agentName);
      }
      
      return fetch(url, opts);
    }

    async function getCsrfToken() {
      try {
        const res = await fetch('/api/admin/csrf', { 
          method: 'POST'
        });
        const data = await res.json();
        return data.csrfToken;
      } catch (err) {
        console.error('Failed to get CSRF token:', err);
        return null;
      }
    }

    async function loadAgents() {
      const wrap = document.getElementById('agentsWrap');
      try {
        const res = await apiFetch('/api/agents', { method: 'GET' });
        const data = await res.json();
        if (data.error) return wrap.innerHTML = `<div class="muted">錯誤: ${data.error}</div>`;
        const rows = data.agents || [];
        if (rows.length === 0) return wrap.innerHTML = '<div class="muted">無帳號</div>';
        const html = ['<table><thead><tr><th>id</th><th>account</th><th>name</th><th>counter</th><th>role</th><th>active</th><th></th></tr></thead><tbody>'];
        for (const a of rows) {
          html.push(`<tr><td>${a.id}</td><td>${a.account}</td><td>${a.name || ''}</td><td>${a.counter || ''}</td><td>${a.role || ''}</td><td>${a.active ? 'Y' : 'N'}</td><td><button data-id="${a.id}" class="edit small">編輯</button> <button data-id="${a.id}" class="del small danger">刪除</button></td></tr>`);
        }
        html.push('</tbody></table>');
        wrap.innerHTML = html.join('');
        document.querySelectorAll('button.edit').forEach(b => b.onclick = onEdit);
        document.querySelectorAll('button.del').forEach(b => b.onclick = onDelete);
      } catch (err) { wrap.innerHTML = `<div class="muted">載入失敗</div>`; console.error(err); }
    }

    async function loadAgentProfile() {
      try {
        const res = await apiFetch('/api/agent/profile', { method: 'GET' });
        const data = await res.json();
        if (data.error) return showMsg('載入個人資料失敗: ' + data.error, true);
        
        CURRENT_AGENT = data.agent;
        
        // Fill editable fields
        document.getElementById('profileName').value = data.agent.name || '';
        document.getElementById('profileCounter').value = data.agent.counter || '';
        
        // Fill display information
        document.getElementById('profileRole').textContent = data.agent.role === 'admin' ? '管理員' : '一般櫃員';
        document.getElementById('profileAccount').textContent = data.agent.account || '-';
        document.getElementById('profileDisplayName').textContent = data.agent.name || '-';
        document.getElementById('profileDisplayCounter').textContent = data.agent.counter || '-';
        
        // Update session storage to ensure consistency
        sessionStorage.setItem('agent_name', data.agent.name || '');
        sessionStorage.setItem('agent_counter', data.agent.counter || '');
        sessionStorage.setItem('agent_role', data.agent.role || '');
        sessionStorage.setItem('agent_account', data.agent.account || '');
      } catch (err) {
        console.error(err);
        showMsg('載入個人資料失敗', true);
      }
    }

    async function onEdit(e) {
      const id = e.currentTarget.getAttribute('data-id');
      const name = prompt('新姓名 (留空不變)');
      const password = prompt('新密碼 (留空不變)');
      const counter = prompt('櫃台 (留空不變)');
      const role = prompt('角色 (admin/留空為一般櫃員)');
      const body = {};
      if (name) body.name = name;
      if (password) body.password = password;
      if (counter) body.counter = counter;
      if (role !== null) body.role = role || '';
      
      try {
        // Get CSRF token for admin operations
        const csrfToken = await getCsrfToken();
        if (!csrfToken) return showMsg('無法取得 CSRF token', true);
        
        const res = await fetch(`/api/agents/${id}`, { 
          method: 'PUT', 
          headers: {
            'Content-Type': 'application/json',
            'x-csrf-token': csrfToken
          },
          body: JSON.stringify(body) 
        });
        const data = await res.json();
        if (data.error) return showMsg('修改失敗: ' + data.error, true);
        showMsg('已修改');
        loadAgents();
      } catch (err) { showMsg('修改失敗', true); }
    }

    async function onDelete(e) {
      const id = e.currentTarget.getAttribute('data-id');
      if (!confirm('確定刪除？')) return;
      try {
        // Get CSRF token for admin operations
        const csrfToken = await getCsrfToken();
        if (!csrfToken) return showMsg('無法取得 CSRF token', true);
        
        const res = await fetch(`/api/agents/${id}`, { 
          method: 'DELETE',
          headers: {
            'x-csrf-token': csrfToken
          }
        });
        const data = await res.json();
        if (data.error) return showMsg('刪除失敗: ' + data.error, true);
        showMsg('已刪除'); 
        loadAgents();
      } catch (err) { showMsg('刪除失敗', true); }
    }

    function initializeAdminInterface() {
      document.getElementById('loginRedirect').classList.add('hidden');
      document.getElementById('mainArea').classList.remove('hidden');
      document.getElementById('adminSection').classList.remove('hidden');
      document.getElementById('profileSection').classList.add('hidden');
      document.getElementById('pageTitle').textContent = '帳號管理（管理員）';
      document.getElementById('loginStatus').textContent = `已登入為管理員 - ${sessionStorage.getItem('agent_name')}`;
      loadAgents();
    }

    function initializeAgentInterface() {
      document.getElementById('loginRedirect').classList.add('hidden');
      document.getElementById('mainArea').classList.remove('hidden');
      document.getElementById('adminSection').classList.add('hidden');
      document.getElementById('profileSection').classList.remove('hidden');
      document.getElementById('pageTitle').textContent = '個人資料管理';
      document.getElementById('loginStatus').textContent = `已登入為櫃員 - ${sessionStorage.getItem('agent_name')}`;
      loadAgentProfile();
    }

    // Logout function
    async function logout() {
      sessionStorage.removeItem('agent_name');
      sessionStorage.removeItem('agent_account');
      sessionStorage.removeItem('agent_counter');
      sessionStorage.removeItem('agent_role');
      sessionStorage.removeItem('agent_id');
      
      // 使用 URL Manager 跳轉到登入頁面
      await urlManager.safeRedirect('/login/index.html');
    }

    // Event handlers
    document.getElementById('logout').onclick = logout;

    document.getElementById('createBtn').onclick = async () => {
      const account = document.getElementById('newAccount').value.trim();
      const name = document.getElementById('newName').value.trim();
      const password = document.getElementById('newPassword').value;
      const counter = document.getElementById('newCounter').value.trim();
      const role = document.getElementById('newRole').value;
      if (!account || !password) return showMsg('account & password required', true);
      
      try {
        // Get CSRF token for admin operations
        const csrfToken = await getCsrfToken();
        if (!csrfToken) return showMsg('無法取得 CSRF token', true);
        
        const res = await fetch('/api/agents', { 
          method: 'POST', 
          headers: {
            'Content-Type': 'application/json',
            'x-csrf-token': csrfToken
          },
          body: JSON.stringify({ account, name, password, counter, role }) 
        });
        const data = await res.json();
        if (data.error) return showMsg('建立失敗: ' + data.error, true);
        showMsg('建立成功');
        document.getElementById('newAccount').value = ''; 
        document.getElementById('newName').value = ''; 
        document.getElementById('newPassword').value = ''; 
        document.getElementById('newCounter').value = '';
        document.getElementById('newRole').value = '';
        loadAgents();
      } catch (err) { showMsg('建立失敗', true); }
    };

    document.getElementById('updateProfileBtn').onclick = async () => {
      const name = document.getElementById('profileName').value.trim();
      const counter = document.getElementById('profileCounter').value.trim();
      const password = document.getElementById('profilePassword').value;
      const body = {};
      
      if (name !== (CURRENT_AGENT?.name || '')) body.name = name;
      if (counter !== (CURRENT_AGENT?.counter || '')) body.counter = counter;
      if (password) body.password = password;
      
      if (Object.keys(body).length === 0) return showMsg('沒有變更', true);
      
      try {
        const res = await apiFetch('/api/agent/profile', { method: 'PUT', body: JSON.stringify(body) });
        const data = await res.json();
        if (data.error) return showMsg('更新失敗: ' + data.error, true);
        showMsg('更新成功');
        document.getElementById('profilePassword').value = '';
        
        // Update session storage if data changed
        if (body.name) {
          sessionStorage.setItem('agent_name', body.name);
        }
        if (body.counter) {
          sessionStorage.setItem('agent_counter', body.counter);
        }
        
        // Reload profile to sync all display information
        loadAgentProfile();
      } catch (err) { showMsg('更新失敗', true); }
    };

    // Initialize the page
    window.addEventListener('load', async () => {
      await checkLoginAndPermissions();
    });
  </script>
</body>

</html>
