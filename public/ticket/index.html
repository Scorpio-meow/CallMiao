<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>票券狀態</title>
  <link rel="stylesheet" href="/ticket/style.css" />
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <div class="container">
    <h1>票券狀態</h1>
    <div id="notifyBar">
      <button id="enableNotify" type="button">啟用提醒</button>
      <span id="notifyStatus" aria-live="polite"></span>
    </div>
    <div id="info"></div>
    <div id="progress" style="margin-top:16px;color:#374151"></div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const id = params.get('id');
    const socket = io();
    let lastStatus = null; // 用於偵測狀態變化
    let forceAlertOnce = false; // 收到重叫(call:made)時的單次提醒旗標

    // 提醒（聲音/震動）相關
    let notifyEnabled = (localStorage.getItem('notifyEnabled') === '1');
    let audioCtx = null;

    function vibrate(pattern){
      try{ if (navigator.vibrate) navigator.vibrate(pattern); }catch(_){}
    }

    function ensureAudio(){
      try{
        if(!audioCtx){
          const AC = window.AudioContext || window.webkitAudioContext;
          if(AC) audioCtx = new AC();
        }
        return audioCtx;
      }catch(_){ return null; }
    }

    function beep(times=2){
      const ctx = ensureAudio();
      if(!ctx) return;
      let t = ctx.currentTime;
      for(let i=0;i<times;i++){
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 880; // A5
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.linearRampToValueAtTime(0.12, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.30);
        osc.connect(gain).connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.32);
        t += 0.38;
      }
    }

    function triggerAlert(){
      if(!notifyEnabled) return;
      vibrate([220,100,220,120,360]);
      try{
        if(audioCtx && audioCtx.state === 'suspended'){
          // 需使用者手勢才能 resume，已透過按鈕處理
        }
        beep(3);
      }catch(_){}
    }

    function setupNotifyUI(){
      const btn = document.getElementById('enableNotify');
      const statusEl = document.getElementById('notifyStatus');
      const reflect = () => {
        if(notifyEnabled){
          btn.style.display = 'none';
          statusEl.textContent = '提醒已啟用（若瀏覽器支援）';
        }else{
          btn.style.display = '';
          statusEl.textContent = '';
        }
      };
      btn.addEventListener('click', async () => {
        try{
          const ctx = ensureAudio();
          if(ctx && ctx.state === 'suspended'){
            await ctx.resume();
          }
        }catch(_){}
        notifyEnabled = true;
        localStorage.setItem('notifyEnabled','1');
        vibrate([100]);
        reflect();
      });
      reflect();
    }

    // 狀態中文對照
    const STATUS_LABEL = {
      waiting: '等候',
      called: '已叫號',
      serving: '服務中',
      finished: '已完成',
      canceled: '已取消',
      cancelled: '已取消'
    };
    function statusLabel(s) { return STATUS_LABEL[s] || (s || '-'); }

    async function load(){
      if(!id){
        document.querySelector('#info').textContent = '缺少票券 ID';
        return;
      }
      const res = await fetch(`/api/ticket/${id}`);
      if(res.status!==200){
        document.querySelector('#info').textContent = '票券不存在';
        document.querySelector('#progress').textContent = '';
        return;
      }
      const { ticket } = await res.json();
      const prev = lastStatus;
      const cur = ticket.status;

      const infoWrap = document.querySelector('#info');
      if (infoWrap) {
        infoWrap.textContent = ''; // clear
        const pNum = document.createElement('p'); pNum.textContent = '號碼：'; const strong = document.createElement('strong'); strong.textContent = String(ticket.number || ''); pNum.appendChild(strong); infoWrap.appendChild(pNum);
        const pStatus = document.createElement('p'); pStatus.textContent = '狀態：' + statusLabel(ticket.status); infoWrap.appendChild(pStatus);
        const pCounter = document.createElement('p'); pCounter.textContent = '櫃台：' + String(ticket.counter || '-'); infoWrap.appendChild(pCounter);
        const pCreated = document.createElement('p'); pCreated.textContent = '建立：' + new Date(ticket.createdAt).toLocaleString(); infoWrap.appendChild(pCreated);
      }

      try{
        // 並行取得總覽與等候名單以顯示進度
        const [ovRes, waitRes] = await Promise.all([
          fetch('/api/overview'),
          fetch(`/api/tickets/waiting?serviceType=${encodeURIComponent(ticket.serviceType || '')}`)
        ]);
        const overview = ovRes.ok ? await ovRes.json() : null;
        const waitingData = waitRes.ok ? await waitRes.json() : { tickets: [] };

        // 目前叫到的號碼（同服務別）
        let nowCallingText = '-';
        if(overview && Array.isArray(overview.currentCalls)){
          const latest = overview.currentCalls
            .filter(x => x.serviceType === ticket.serviceType)
            .sort((a,b)=> new Date(b.calledAt||0) - new Date(a.calledAt||0))[0];
          if(latest){
            nowCallingText = `${latest.number}${latest.counter?`（${latest.counter}櫃台）`:''}`;
          }
        }

        // 前方尚有幾位（僅在等候狀態時顯示）
        let aheadText = '';
        if(ticket.status === 'waiting'){
          const mineTime = new Date(ticket.createdAt).getTime();
          const list = Array.isArray(waitingData.tickets) ? waitingData.tickets : [];
          const ahead = list.filter(t => new Date(t.createdAt).getTime() < mineTime).length;
          aheadText = `前面尚有：${ahead} 位`;
        }else{
          aheadText = '';
        }

        const progressEl = document.querySelector('#progress');
        if (progressEl) {
          progressEl.textContent = '';
          const pNow = document.createElement('p'); pNow.textContent = '目前叫號：' + nowCallingText; progressEl.appendChild(pNow);
          if (aheadText) { const pAhead = document.createElement('p'); pAhead.textContent = aheadText; progressEl.appendChild(pAhead); }
        }
      }catch(e){
        // 靜默失敗，不影響基本資訊顯示
        document.querySelector('#progress').textContent = '';
      }

      // 是否需要提醒：
      const isActiveState = (cur === 'called' || cur === 'serving');
      const needAlert = (prev && prev !== cur && isActiveState) || (forceAlertOnce && isActiveState);
      if(needAlert){
        triggerAlert();
      }
      forceAlertOnce = false; // 用一次就清除
      lastStatus = cur;
    }

    socket.on('queue:update', load);
    socket.on('call:made', (data) => {
      try{
        const eid = data && data.ticket && String(data.ticket.id);
        if(eid && String(id) === eid){
          // 是同一張票的重叫或初次叫號，標記一次提醒
          forceAlertOnce = true;
        }
      }catch(_){}
      load();
    });
    setupNotifyUI();
    load();
  </script>
</body>
</html>
