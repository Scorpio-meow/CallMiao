<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>叫號進度 - 叫號喵</title>
  <link rel="stylesheet" href="/shared/base.css" />
  <link rel="stylesheet" href="/ticket/style.css" />
  <script src="/socket.io/socket.io.js"></script>
</head>

<body>
  <main class="ticket-page">
    <header class="ticket-header">
      <span class="brand">叫號喵</span>
      <h1>叫號進度</h1>
    </header>

    <div id="info" class="card empty-state">
      <strong>載入中…</strong>
    </div>

    <section id="ticketCard" class="card ticket-card hidden" aria-labelledby="ticketNumberLabel">
      <span id="ticketNumberLabel" class="muted">您的號碼</span>
      <p id="ticketNumber" class="ticket-number tabular"></p>
      <span id="ticketStatus" class="badge status"></span>
      <p id="ticketCallout" class="callout hidden"></p>
    </section>

    <section id="progress" class="card hidden" aria-label="叫號進度">
      <dl class="progress-list">
        <div>
          <dt>目前叫號</dt>
          <dd id="currentCall" class="tabular">-</dd>
        </div>
        <div id="aheadRow" class="hidden">
          <dt>前面還有</dt>
          <dd><span id="aheadCount" class="ahead tabular"></span> 位</dd>
        </div>
        <div>
          <dt>櫃台</dt>
          <dd id="ticketCounter">-</dd>
        </div>
        <div>
          <dt>取號時間</dt>
          <dd id="ticketCreated" class="tabular">-</dd>
        </div>
      </dl>
    </section>
  </main>

  <div id="notifyBar" class="bottom-bar hidden">
    <button id="enableNotify" class="btn btn-primary btn-block" type="button">開啟到號提醒</button>
    <p id="notifyStatus" class="notify-status muted hidden" aria-live="polite">已開啟到號提醒，輪到您時手機會震動並發出提示音</p>
  </div>

  <script src="/ticket/index.js"></script>
</body>

</html>
